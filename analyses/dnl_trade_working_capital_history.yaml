# Denali trade working capital — the observed series
#
# Raw observations only. Nothing here is derived and nothing here is an
# assumption: every figure is read directly off the source named below, in the
# units and on the definition the company itself publishes. The intensity that
# the valuation consumes is computed from this file by committed code and is
# never stored (D-16, D-48).
#
# WHY THIS FILE EXISTS
#
# D-31 held Denali's working-capital intensity at a single FY2025 observation,
# saying plainly that one year was too thin to round confidently and that it
# should be revisited when a genuine two-year average could be struck.
# `design/methodology/dnl_working_capital_derivation.md` §5 makes the same
# complaint under the heading "the evidence is thinner than I would like": FY25
# was the only reported balance sheet in the register and FY2021-FY2024 in the
# UI generator are labelled mock placeholders, so there was no trend to test.
#
# The obvious repair — strike the intensity over the FY2024-FY2025 window that
# D-48 uses for the capex and depreciation pair — is NOT AVAILABLE, and the
# reason matters. A statement of financial position is not restated for
# discontinued operations the way an income statement is. The FY2024 comparative
# in the FY25 annual report is therefore the pre-demerger group: cash 1,068.9
# against FY25's 647.2, inventories 785.3 against 519.1, current tax liabilities
# 238.3 against 8.7. Pairing that balance sheet with continuing-operations
# revenue would be exactly the entity mismatch D-50 was written to stop. D-48's
# window works for capex and depreciation only because those come from the
# segment note, which IS restated; working capital has no segment equivalent.
#
# What is available instead is the series below, published by the company in its
# own half-year results announcement, on a consistent definition, across nine
# periods. Two of those periods are cleanly post-demerger.

source:
  document: data/financials/historical/dnl/dnl_1h26_results_announcement_2026.pdf
  table: "DYNO NOBEL LIMITED — FINANCIAL POSITION"
  units: AUD m
  extracted: 2026-09-14
  extraction_method: "pdftotext -layout; figures transcribed unaltered"

# The company's published definition, which is NARROWER than the one D-29/D-31
# ratified. Recorded explicitly so the two are never conflated.
definition:
  name: trade_working_capital
  formula: inventories + trade_debtors - trade_creditors
  note: >
    This is management's measure as published. It is not the ratified measure,
    which is total current assets less cash, less total current liabilities plus
    current interest-bearing debt, and which reproduces D-31's rate exactly on
    FY2025. On the same FY2025 balance sheet the two measures do not agree:
    the statutory construction in dnl_working_capital_derivation.md §2 gives
    625.9, this series gives 608.8. The difference is definitional, not an
    error — the published measure uses management's trade debtor and trade
    creditor lines rather than the statutory trade-and-other captions. Whichever
    measure is used must be used on both the numerator and every period of the
    series, and must be the measure the UI discloses.

# demerger_status: which entity each observation belongs to. The Incitec Pivot
