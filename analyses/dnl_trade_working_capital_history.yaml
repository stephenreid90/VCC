# Revenue, for the denominator. Recorded separately from the balance-sheet
# series because it comes from a different table and carries its own entity
# question.
revenue_observations:
  - period: FY2025
    label: "Year to 30 September 2025"
    basis: continuing_operations
    revenue: 3710.1
    source: data/financials/dnl.yaml working_capital_history

  - period: 1H2026
    label: "Half to 31 March 2026"
    basis: explosives
    revenue: 1609.8
    source: "1H26 results announcement, revenue split — explosives"

  - period: 1H2025
    label: "Half to 31 March 2025"
    basis: explosives
    revenue: 1473.0
    source: "1H26 results announcement, prior-comparative revenue split — explosives"

# OPEN — the denominator for the March 2026 observation is not settled and is
# deliberately not resolved here.
#
# A balance sheet struck at 31 March must be paired with a revenue figure
# covering the twelve months to that date, not a half-year. The obvious
# construction is FY2025 + 1H2026 - 1H2025. But the three revenue figures above
# do not sit comfortably together: that construction implies a second half of
# FY2025 far larger than the first, which is either a real seasonal and
# post-demerger volume skew or a sign that the FY2025 figure and the half-year
# splits are drawn on different bases. Until that is resolved from the accounts
# rather than by arithmetic, the March 2026 intensity should not be published.
#
# The September 2025 observation has no such problem: balance sheet and revenue
# are the same entity, the same basis and the same date.
strike_window:
  status: NOT_YET_SET
  eligible_periods: [2025-09-30, 2026-03-31]
  blocked_on: >
    Confirming the FY2025 revenue basis against the half-year splits, so that a
    trailing-twelve-month denominator to 31 March 2026 can be constructed from
    figures that belong together. Recorded rather than assumed (D-50).
