# Revenue, for the denominator. Recorded separately from the balance-sheet
# series because it comes from a different table and carries its own entity
# question.
revenue_observations:
  - period: FY2025
    label: "Year to 30 September 2025"
    basis: continuing_operations
    revenue: 3710.1
    source: >
      FY25 annual report, consolidated income statement — "Revenue 3,710.1",
      confirmed against the segment note's "External sales from continuing
      operations 3,710.1". CHECKED 14 Sep 2026 and it holds: the group figure
      including the demerged fertilisers business is 5,345.2, of which 1,635.1
      is discontinued. The ratified denominator behind D-31 is therefore on the
      continuing-operations basis and matches the entity its balance sheet
      belongs to. Previously carried in data/financials/dnl.yaml
      working_capital_history with no stated basis.

  - period: FY2024
    label: "Year to 30 September 2024"
    basis: continuing_operations
    revenue: 3537.9
    source: >
      Same income statement, prior-year comparative. Recorded to make the point
      explicit: an income statement IS restated for discontinued operations, so
      a continuing-operations FY2024 revenue exists. A balance sheet is not, so
      there is no FY2024 continuing-operations working capital to pair with it.
      That asymmetry is the whole reason the D-48 window cannot be reused here.

  - period: 1H2026
    label: "Half to 31 March 2026"
    basis: explosives
    revenue: 1609.8
    source: >
      1H26 results announcement, Income Statement Table 2. The table splits the
      half three ways and the columns are labelled: Group 1,897.8 = Explosives
      1,609.8 + Discontinued Operations 288.0. "Explosives" is the continuing
      entity, so this is the same basis as the FY2025 figure above.

  - period: 1H2025
    label: "Half to 31 March 2025"
    basis: explosives
    revenue: 1473.0
    source: "1H26 results announcement, prior-comparative revenue split — explosives"

# RESOLVED 14 September 2026. The denominator question is answered from the
# accounts, not by arithmetic.
#
# The 1H26 announcement's Income Statement (Table 2) labels its columns
# explicitly: Group = Explosives + Discontinued Operations, 1,897.8 = 1,609.8 +
# 288.0 for the half to 31 March 2026, and 2,250.7 = 1,473.0 + 777.7 for the
# comparative half. "Explosives" is the continuing entity and is the same basis
# as the FY2025 continuing-operations figure. So a trailing-twelve-month
# denominator to 31 March 2026 can be built from figures that belong together:
# FY2025 + 1H2026 - 1H2025.
#
# The apparent skew that blocked this yesterday is real and explicable rather
# than a basis mismatch. The implied second half of FY2025 is much larger than
# the first, because Denali's first half runs October to March and its largest
# region is North America, where the northern winter suppresses mining activity.
# The half-year balance sheets sit at opposite points of that cycle, which is an
# argument FOR averaging the two rather than against it: a rate struck on
# 30 September alone is struck at one end of a seasonal swing.

# NOT CONSUMED. The window below is set and the rate derives cleanly from it,
# but nothing in the valuation reads it. D-57 retained D-31's ratified intensity
# on 14 September 2026: the case for changing it rested on a review item that
# turned out to describe a legacy test fixture rather than the live assembler,
# and what was left was a definitional change to a measure that already works,
# on two observations rather than a series. This file is therefore EVIDENCE,
# held for the FY26 result, when a second post-demerger full year makes the
# window a genuine two-year one on one definition. It is committed rather than
# discarded so that the revisit starts from extracted, sourced, tested figures
# instead of repeating the extraction.

strike_window:
  status: SET
  set_on: 2026-09-14
  entity: "Dyno Nobel — continuing operations (explosives)"
  window: "30 September 2025 and 31 March 2026"
  level: "published trade working capital; continuing-operations revenue"
  method: mean_of_period_intensities
  periods:
    - period: 2025-09-30
      numerator: trade_working_capital_published
      denominator_period: FY2025
      denominator_note: "balance-sheet date is the fiscal year end; revenue is that year"
    - period: 2026-03-31
      numerator: trade_working_capital_published
      denominator_period: TTM_2026-03-31
      denominator_note: "FY2025 + 1H2026 - 1H2025, all continuing operations"
  supersedes: >
    D-31's single FY2025 observation on the statutory definition. D-31 said one
    year was too thin to round confidently and asked to be revisited when a
    genuine two-period average could be struck; this is that revisit.
  caveat: >
    Two observations six months apart is better than one and is still not a
    long series. The seven pre-demerger periods above cannot extend it — they
    belong to a different entity — so the window will not lengthen until a
    second post-demerger full year lands at the FY26 result.
