[pytest]
markers =
    libreoffice: needs a working `soffice` on PATH. Deselected by default so the
        suite has no spreadsheet dependency; run deliberately with
        `pytest -m libreoffice`. These tests rebuild the generated workbooks and
        recalculate them, which is what makes the committed oracle fixtures
        trustworthy rather than merely committed.
addopts = -m "not libreoffice"
