company_position:
  id: dnl
  name: Dyno Nobel Limited
  ticker: ASX:DNL
  reporting_currency: AUD
  functional_currency: AUD
  functional_currency_rationale: >
    Dyno Nobel Limited (formerly Incitec Pivot Limited; renamed in March 2025
    following the demerger of the fertilisers business). Per IAS 21 / AASB 121
    the parent's functional currency is AUD given Australian incorporation,
    ASX listing, AUD-denominated parent financing, and the Australian regulatory
    and reporting environment. The framework's per-entity functional-currency
    treatment (§8.2 schema) captures USD-dominant operations through the
    per-segment functional currency block — see segments[].functional_currency
    below. Dyno Nobel Americas subsidiary operates with USD functional currency
    (predominantly US revenue, US-denominated input cost base — gas, ammonia,
    ammonium nitrate — and US-denominated long-term gas supply contracts).
    Australian operations operate with AUD functional currency. Consolidation
    translates the USD-functional Americas subsidiary into AUD at the parent
    level. This refines an earlier draft position that treated the consolidated
    functional currency as USD — the parent itself is AUD-functional; the
    USD-functional treatment applies specifically to the US subsidiary as the
    architecture's per-segment functional currency block intends.

  # ---- Consolidated, parent-level blocks ----

  balance_sheet:
    net_debt_ebitda: 2.12
    leverage_posture: moderate
    liquidity: >
      Adequate. Post-demerger net debt / TTM EBITDA at 2.12x sits at the
      upper end of moderate leverage; AUD 207M cash plus AUD 440M short-term
      investments provides AUD 647M liquidity buffer. Cash flow generation
      supports debt service across the commodity cycle but FY25 free cash
      flow of AUD 101M was thin given AUD 162M dividends + AUD 289M
      buybacks. Net debt expected to ease over the next 12 months as
      post-demerger integration completes and the capex / revenue ratio
      normalises from FY25's inflated 12.8% toward the underlying 6-7%.

  capital_allocation:
    dividend_policy: >
      Progressive dividend policy targeting 60-70% payout ratio of
      underlying earnings, subject to maintaining investment-grade credit
      metrics. Post-demerger dividend rebased from pre-demerger combined
      entity.
    buyback_posture: >
      Occasional opportunistic buybacks when share price is materially
      below intrinsic value and net-debt/EBITDA is comfortably below
      target range.
    m_and_a_posture: >
      Selectively acquisitive. Focus on bolt-on technology acquisitions
      (electronic initiation, AI-driven blast design) and modest
      regional capability extensions. Not a serial large-scale acquirer.
    reinvestment_rate: 0.50

  management_and_governance:
    strategy_quality: moderate
    strategy_evidence: >
      Strategic clarity improved materially through the demerger process.
      Post-demerger strategy focuses on technology-led services growth,
      operational efficiency in core manufacturing, and selective capacity
      additions in growth markets. Coherent narrative but not
      transformational.
    execution_track_record: moderate
    execution_evidence: >
      Mixed historical record on large capital projects (Louisiana ammonia
      plant cost overruns from 2017-2020 are well-documented). Operating
      execution in core explosives business has been solid; capital
      project execution has been the historical weakness. Post-demerger
      management team has continuity from the legacy executive ranks.

  esg_and_transition:
    carbon_intensity: >
      High Scope 1 and Scope 2 emissions from ammonia production
      (carbon-intensive Haber-Bosch process). Scope 3 emissions
      meaningful via customer mix (thermal coal mining customers).
      Disclosure aligned with TCFD recommendations.
    transition_plan: >
      Committed to net-zero by 2050 with interim 2030 target.
      Investment in green ammonia / blue ammonia pilots underway;
      not yet at commercial scale. Transition risk acknowledged but
      not material near-term to industry returns.
    stranded_asset_exposure: >
      Moderate. Customer-mix concentration in coal mining (both met and
      thermal) creates indirect stranded-asset exposure; own
      ammonia-production assets are partially exposed to carbon pricing
      flow-through. Long-life ammonia plants are the primary direct
      exposure but have residual value as feedstock for green-ammonia
      transition where economics support it.

  scenario_sensitivity_overrides_global:
    energy_transition:
      operational_carbon_exposure:
        rating: high
        rationale: >
          IPL's ammonia production is carbon-intensive; carbon-pricing
          regimes flow through to margins more directly than for downstream
          industrial explosives producers without ammonia integration.
    trade_and_supply_chain:
      supply_chain_concentration:
        rating: moderate
        rationale: >
          IPL is more vertically integrated than some Tier 2 competitors
          (own ammonia production), reducing supplier-power exposure on the
          critical input. Below archetype average on this dimension.

  # ---- Per-segment positioning ----

  segments:
    - segment: industrial_explosives
      industry_archetype: industrial_explosives
      functional_currency: USD
      functional_currency_rationale: >
        Sole post-demerger segment. USD functional currency reflects that
        the dominant operating unit within the segment is Dyno Nobel Americas
        (USD revenue, USD inputs, USD long-term gas contracts). The
        Australian sub-operation within the segment is AUD-functional, but
        for segment-level valuation purposes the segment is treated as
        USD-dominant given approximately 55% US / 35% Australia / 10% EMEA-
        LATAM revenue split. Architecture spec §8.2 supports finer-grained
        per-region functional-currency treatment if the analyst wants to
        sub-segment further; v0.1 keeps it at the single-segment level with
        USD as the dominant currency and per-region functional-currency
        commentary captured in the financials data file
        (`data/financials/dnl.yaml`).
      revenue_share: 1.00
      ebit_share: 1.00
      notes: >
        Single-segment post-demerger. Pre-demerger, IPL operated two
        distinct segments (Dyno Nobel explosives + Fertilisers Australia);
        the fertilisers business was demerged in March 2025 and the
        remaining entity was renamed to Dyno Nobel Limited. The Louisiana
        ammonia plant continues to sell residual ammonia to the fertilizer
        market alongside its primary explosives-feedstock role — this
        residual fertilizer revenue is a downstream sale channel rather
        than a separate operating segment.

      market_positions:
        - market: North American industrial explosives
          unit: revenue
          share: 0.30
          rank: 1
          share_trend:
            direction: stable
            delta_5yr_bps: 0
            narrative: >
              Co-leader with Austin Powder / Orica in different sub-segments.
              Stable share with periodic contract wins and losses cancelling
              over the cycle.

        - market: Australian industrial explosives
          unit: revenue
          share: 0.40
          rank: 2
          share_trend:
            direction: stable
            delta_5yr_bps: 0
            narrative: >
              Number two to Orica in the Australian duopoly. Share has been
              broadly stable; some swings on individual major contract
              renewals (BHP, Rio, FMG).

        - market: RoW industrial explosives
          unit: revenue
          share: 0.05
          rank: 4
          share_trend:
            direction: gaining
            delta_5yr_bps: 50
            narrative: >
              Sub-scale in Latin America, Africa, Asia ex-China. Modest
              share gains from specific contract wins; not a strategic
              focus.

      moat:
        sources:
          - scale
          - switching_cost
          - regulatory
          - resource
        durability: moderate
        evidence: >
          Scale: top 2 globally; cost advantage in US from gas-contract
          position. Switching costs: on-site manufacturing infrastructure
          at major customer sites creates physical lock-in; technical
          re-qualification for new supplier is non-trivial. Regulatory:
          explosives licensing across jurisdictions raises entry hurdles.
          Resource: long-term US natural gas supply contracts predating
          recent pricing moves provide a cost-curve advantage that decays
          slowly as contracts roll over.

      competitive_position:
        cost_position:
          placement_on_curve: 2nd
          evidence: >
            US operations sit in the bottom quartile of the cost curve
            due to long-term gas contracts. Australian and RoW operations
            are closer to industry average. Consolidated cost position
            is the second quartile when weighted across regions.
        differentiation_position:
          pricing_power: moderate
          differentiation_basis:
            - switching_cost
            - service
            - ip
          evidence: >
            Differentiation strongest in technology products (DigiShot
            electronic initiation system) and on-site service offerings
            (blast-design optimisation, fragmentation analysis). Bulk
            ANFO is commodity-like with limited differentiation.

      innovation_position:
        rd_intensity: 0.015
        pipeline_strength: moderate
        pipeline_horizon_years: 5
        evidence: >
          R&D spend approximately 1.5% of revenue. Pipeline includes
          next-generation electronic initiation systems, AI-driven
          blast design and fragmentation services, and longer-term
          green-ammonia / decarbonised manufacturing initiatives.
          Pipeline strength is moderate — credible programs but neither
          best-in-class nor genuinely differentiated from Orica.

      franchise_assets:
        assets:
          - "Long-term mining offtake contracts with major Australian miners (BHP, Rio Tinto, FMG)"
          - "Long-term US natural gas supply contracts (predating recent gas-price moves)"
          - "On-site manufacturing infrastructure at major customer mine sites"
          - "Operating licences and explosives-handling regulatory approvals across multiple jurisdictions"
          - "Multi-decade customer relationships in the duopolistic Australian market"
        durability: high
        evidence: >
          Contract durations typically 5-10 years with embedded renewal
          mechanisms. On-site infrastructure represents customer-specific
          sunk capital from both sides. Regulatory approvals are
          jurisdiction-specific and non-trivial for new entrants to
          replicate.

      capability_profile:
        strengths:
          - "Cost advantage in US operations from gas-contract position"
          - "Scale in manufacturing and distribution"
          - "Customer relationships and on-site service capability"
          - "Electronic initiation technology (DigiShot platform)"
        gaps:
          - "Lower geographic diversification than Orica (more US-weighted)"
          - "Smaller technology / R&D budget than Orica"
          - "Capital-project execution track record (Louisiana ammonia plant)"
          - "Less footprint in growth EM markets than Solar Industries / EPC Groupe"

      risk_exposures:
        commodity:
          - "Natural gas (input via ammonia)"
          - "Ammonia spot pricing (where contract-uncovered)"
          - "Thermal coal mining customer exposure (~20% of mining customer mix)"
          - "Met coal mining customer exposure (~15-20% of mining customer mix)"
        regulatory:
          - "Explosives security and licensing"
          - "Dangerous-goods transport regulation"
          - "Carbon pricing / cross-border carbon adjustment mechanisms"
          - "Australian state-level workplace safety reforms"
        customer_concentration:
          top_n: 5
          share_of_revenue: 0.45
          narrative: >
            Top 5 customers (BHP, Rio Tinto, FMG, large US miners) account
            for approximately 45% of revenue. Top 10 customers approximately
            65%. Loss of any single major customer is recoverable over time
            but materially affects short-run financials.
        geographic_concentration:
          regions:
            - geo: United States
              share_of_revenue: 0.55
            - geo: Australia
              share_of_revenue: 0.35
            - geo: Rest of World
              share_of_revenue: 0.10
          narrative: >
            US is the dominant geography post-demerger. Australia significant
            but smaller than pre-demerger. RoW limited.

      archetype_specific:
        us_gas_contract_maturity_profile: >
          Average contract maturity 6 years remaining. Tiered roll-off
          through to 2032 with re-pricing risk concentrated in 2028-2030
          window.
        electronic_detonator_revenue_share: 0.18
        on_site_service_unit_count: ">200 mobile manufacturing units across
          customer mine sites"
        ammonia_self_supply_share: 0.55
        coal_customer_mix_share: 0.35

      scenario_sensitivity_overrides: null

  corporate_actions: []

# --- NORMALISED VALUATION BASELINE (layer 2: method and selection) ---
# Migrated from data/financials/dnl.yaml `normalised_baseline` on 22 July 2026 per
# design/single_source_of_truth.md §3. Hand-authored; never machine-written.
# TODO (protocol rule 8): add decided_on date + status to each entry.
normalised_baseline:
  # Operating-margin override
  ebit_margin: 0.135
  ebit_margin_rationale: >
    Mid-point of pre-demerger Dyno Nobel segment range of 13-15%.
    Replaces TTM Mar-2026 reported operating margin of 11.23%, which
    is depressed by post-demerger transition costs (residual demerger
    items + post-rename consolidation adjustments, per income-
    statement TTM notes above).


  # --- Valuation base and timing (workbook Assumptions B6, B9, B78; migrated
  # from the hand-typed tests/dcf/golden/dnl_mt_inputs.py on 2026-08-12). The
  # normalised continuing-ops base, the explicit horizon, and the stub fraction
  # (valuation date -> first FY-end). ---
  base_year_revenue: 3400.0
  base_year_revenue_rationale: >
    Normalised continuing-operations base (workbook B9). Excludes the residual
    Phosphate Hill / demerger revenue carried in the TTM-to-31-Mar-2026 reported
    3,905.4 (data/financials/dnl.yaml) — that basis question was ruled on: 3,400
    is the clean forward base for the surviving explosives business; 3,905 mixes
    in separated activity and 4,139 is an FY27 figure, not a base.
  horizon_years: 5
  horizon_years_rationale: >
    Five explicit forecast years (workbook B78) before the Gordon-growth
    terminal. Short enough that structural shifts (e.g. §9.7 demographics) sit
    beyond it; long enough to carry the margin-transformation and gas-roll-off
    glides to steady state.
  # The valuation date, stated rather than implied. It was only ever recoverable
  # by adding period_a_days to the financials' anchor date and reading a comment,
  # which is not a source of truth (batch 3, item 13). Now checked against both
  # the anchor walk and the stub fraction by tests/test_ssot_lint.py check 12.
  valuation_date: 2026-05-25
  valuation_date_rationale: >
    31 March 2026 (the §5.3 balance-sheet anchor for net debt and share count)
    plus the 55-day Period-A walk. The stub then runs from here to the 30
    September fiscal year-end — 128 days, 0.351 years.

  stub_years: 0.351
  stub_years_rationale: >
    Fractional stub from the valuation date to the first fiscal year-end
    (workbook B6; ~128 days / 365). Revenue for the stub is base-year revenue
    x this fraction; mid-period discounting measures the stub from the valuation
    date (methodology §7 / engine mechanics).

  # --- Working-capital intensity (D-09/D-29; working_capital_intensity_from_data()) ---
  working_capital_intensity:
    clean_years: [FY2025]
    rounding: nearest_5pct
    rationale: >
      Ratified 21 Aug 2026, PROVISIONAL. Only one statutory balance sheet is
      filed (30 Sep 2025 -> 13.76% raw, rounds to 15% under the standing
      nearest-5%-protocol). Stephen elected to proceed with the unrounded
      13.76% for now rather than the rounded 15%, pending the 1H26 Appendix 4D
      half-year financial report (31 Mar 2026, the model's own anchor date),
      which would extend this to two observations and let the standard
      average-then-round protocol apply properly. Revisit when that document
      is retrieved — see working_capital_treatment.md §6.4 and §7 (single-
      observation caution).
    rounding_override: 0.1376
    rounding_override_rationale: >
      Applies the raw single-year figure instead of the rounded 15%, at
      Stephen's direction (21 Aug 2026) — see rationale above. Remove this
      override once a second observation lands and the standard protocol can
      run unmodified.

  # --- Terminal reinvestment (D-13) ---
  terminal_reinvestment:
    mode: normalised
    capex_rule: equals_da
    rationale: >
      Ratified 20 Aug 2026 (D-13) and sized 23 Aug 2026. The terminal is struck
      from its components rather than by capitalising the final explicit year's
      FCFF, for two reasons that are really one. Capex: a perpetuity growing at
      g cannot sustainably reinvest at the explicit period's rate, so terminal
      capex is set equal to D&A — the steady-state condition. Working capital:
      capitalising the last explicit year carried a build struck on ~6.2%
      revenue growth into a perpetuity growing at ~2.5%, roughly two and a half
      times the drag the terminal actually bears; the normalised terminal
      applies g x intensity per working_capital_treatment.md §1 instead. This
      is the same algebra the segment engine already uses for CSL, so both FCFF
      engines now strike the terminal the same way. Retires the audited
      capitalise-last-FCFF oracle; see working_capital_treatment.md §7.3.

  # --- Equity-bridge run-rates (workbook Assumptions B84, B86, B87, B108, B110;
  # migrated from the hand-typed golden on 2026-08-12). The Period-A net-debt
  # walk inputs (methodology §7), the AASB-16 lease line and the market
  # reference. The net-debt anchor itself (1,260.8 @ 31 Mar 2026) and the issued
  # share count (1,770m) already live in data/financials/dnl.yaml under the §5.3
  # anchor, so they are NOT duplicated here. ---
  equity_bridge_run_rates:
    period_a_days: 55                     # B84: anchor (31 Mar 2026) -> valuation date, in days
    operating_cash_flow_run_rate: 500.0   # B86: OCF generated over Period A (reduces net debt)
    capex_run_rate: 256.0                 # B87: capex paid over Period A (raises net debt)
    lease_liabilities: 194.3              # B108: AASB 16, Approach A. A later date than the
                                          #   211.5 FY25-close capital_lease_obligations in financials.
    market_reference_price: 3.61          # B110: Wall St target (share price at anchor 3.6061)

  # --- Revenue-growth chain, scenario-keyed (methodology §11; migrated from the
  # hand-typed tests/dcf/golden/dnl_mt_inputs.py on 2026-08-12). Company nominal
  # revenue growth (workbook B42) = industry_nominal x geo_mix + net Five-Forces
  # offset. The industry baseline and the company offset are kept as SEPARATE
  # rows per standing rule 1 / §11 (industry-archetype baseline + company-position
  # offset explicit; the company figure derived, never direct-input).
  #
  # NOTE on layering: the industry_baseline coefficients below are, in principle,
  # archetype-level (industrial_explosives) and the two macro drivers
  # (mining_real_growth, inflation, gas_price_growth) are scenario-level. They
  # sit here for now because (a) the strict IndustryArchetypeFile schema forbids
  # extra keys, and (b) these Muddle-Through macro values are the DNL v6 workbook's
  # own Assumptions-sheet figures and DIFFER from data/scenarios/muddle_through.yaml
  # (world GDP 2.3%, CPI 3.0%) — reconciling the workbook basis to the published
  # scenario macros is separate, later work. Promoting industry_baseline to the
  # archetype file (with a schema field) is a follow-up. ---
  # V6 nomenclature and cell refs (Assumptions B17-B42; scenario macros from
  # dnl_scenarios_comparison_v4 Inputs sheet). ONLY yellow-cell inputs live here;
  # every derived row (industry volume B25, industry pricing B29, industry nominal
  # B30, DM/EM weighting B33/B34, geo-mix multiplier B36, net offset B41, company
  # nominal B42) is computed and exposed as an auditable step by
  # translator.revenue_growth_chain_from_data — never stored back here.
  #
  # Structure: `shared` holds the scenario-invariant industry coefficients and the
  # DNL company offset; `by_scenario` holds only the per-scenario macro drivers.
  # This is the methodology's industry-baseline + company/scenario-offset split
  # (standing rule 1 / §11) and de-duplicates the shared coefficients across the six.
  revenue_growth_chain:
    shared:
      industry_structure:
        # Volume build (B23-B25): volume = a x mining_real_growth + b.
        volume_coefficient_a: 1.15        # B23: volume beta to mining real growth
        volume_constant_b: 0.004          # B24: pickup from ore-grade decline / waste tonnage
        # Pricing build (B26-B29): pricing = w_infl x DM_inflation + w_gas x gas + productivity.
        pricing_weight_inflation: 0.7     # B26: 70% of price tracks DM inflation
        pricing_weight_gas: 0.3           # B27: 30% of price tracks gas input cost
        productivity_sharing: 0.005       # B28: +50bps net productivity uplift / yr
      company_offset:
        # Geo-mix (B33-B36). DM/EM weighting is DERIVED from the segment's
        # geographic_concentration (developed_market_regions -> DM; the rest -> EM),
        # so the workbook's hardcoded 0.9/0.1 becomes an auditable derived step
        # rather than a stored input. em_growth_premium is the yellow cell (B35).
        # Scenario-invariant: DNL's competitive position does not change by world.
        developed_market_regions:         # classify geographic_concentration into DM vs EM
          - United States
          - Australia
        em_growth_premium: 1.3            # B35: EM mining-services grow ~30% faster than DM
        # Net company-position offset (B37-B41), Five-Forces-anchored, verbatim.
        five_forces_offset:
          rivalry_competitive_position: -0.003   # B37: DNL #2 vs Orica #1; scale + tech lead. -30bps
          rivalry_product_mix: -0.001            # B38: more bulk-ANFO weighted. -10bps
          new_entrants_pipeline_uplift: 0.0015   # B39: DNEL LATAM/Africa ramp (time-limited). +15bps
          buyer_supplier_substitutes: 0.0        # B40: at industry average. net 0
    by_scenario:
      # Per-scenario macro (B18/B19/B20 + B17 context memo). dm_real_gdp_growth is
      # carried for traceability but NOT consumed (the chain keys off mining real
      # growth + DM inflation). Values are the dnl_scenarios_comparison_v4 Inputs sheet.
      #
      # DM-INFLATION BASIS (reconciliation, 12 Aug 2026). `dm_inflation` here is a single
      # NORMALISING, pricing-pass-through developed-market inflation input for the explosives
      # revenue chain (it enters pricing at the 0.7 weight, above). It is INTENTIONALLY distinct
      # from the world-scenario file's `cpi_inflation_advanced` (data/scenarios/<id>.yaml), which
      # is a sticky-headline advanced-economy CPI *time series* (yr 1/3/5/10). The chain value
      # sits a little BELOW the scenario's near-term sticky headline and moves in the same
      # direction across worlds — e.g. Muddle Through dm_inflation 2.5% vs scenario CPI 3.0%;
      # Orderly 2.0% vs 2.8%; Stagflation 4.5% vs 5.0%. Both are correct: the scenario file is the
      # world headline, this is the through-cycle DM pricing input the engine consumes. The two are
      # NOT wired together today; formally deriving the chain input from the scenario CPI is a macro-
      # layer decision that WOULD move the valuation, so it is deferred to Stephen (methodology owner).
      muddle_through:
        macro: {dm_real_gdp_growth: 0.020, dm_inflation: 0.025, global_mining_real_growth: 0.025, gas_price_growth: 0.020}
      orderly_convergence:
        macro: {dm_real_gdp_growth: 0.025, dm_inflation: 0.020, global_mining_real_growth: 0.040, gas_price_growth: 0.015}
      ai_productivity_lag:
        macro: {dm_real_gdp_growth: 0.017, dm_inflation: 0.025, global_mining_real_growth: 0.020, gas_price_growth: 0.020}
      fragmentation:
        macro: {dm_real_gdp_growth: 0.010, dm_inflation: 0.035, global_mining_real_growth: 0.015, gas_price_growth: 0.040}
      disorderly_climate_crystallisation:
        macro: {dm_real_gdp_growth: 0.015, dm_inflation: 0.035, global_mining_real_growth: 0.020, gas_price_growth: 0.060}
      stagflation_persists:
        macro: {dm_real_gdp_growth: 0.005, dm_inflation: 0.045, global_mining_real_growth: 0.000, gas_price_growth: 0.050}

  # Net-debt override
  net_debt: 1300.0
  net_debt_rationale: >
    Steady-state mid-point of estimated AUD 1.2-1.4bn underlying
    leverage. Replaces reported AUD 1,810m, which reflects post-
    demerger balance-sheet restructuring expected to ease over the
    next 12 months (per derived-metrics notes above). Net debt /
    EBITDA at this level is ~1.5x on TTM EBITDA — mid-range for the
    industrial-explosives peer group.


  # Capex (% of revenue) — already normalised in current smoke test;
  # capturing here for transparency.
  capex_pct_revenue: 0.07
  capex_pct_revenue_rationale: >
    Pre-demerger historical pattern (6-7%). FY25 reported 12.8% is
    inflated by partial-year reporting and capital restructuring;
    rejected as the steady-state anchor.


  # Tax rate
  tax_rate: 0.30
  tax_rate_rationale: >
    Australian statutory rate. Effective rate runs lower (FY25: 20.4%)
    due to franking / R&D / foreign tax credits, but those are timing
    and mix effects; statutory is the conservative anchor for a
    forward-looking baseline.


  # D&A (% of revenue)
  # da_pct_revenue lives at engine_overlays.baseline.da_pct_revenue, which is
  # what the engine reads. The copy that used to sit here was removed on
  # 23 Aug 2026 (batch 3, item 12b); the rationale stays.
  da_pct_revenue_rationale: >
    Matches assumed capex/revenue ratio of 7%, consistent with a
    steady-state mature industrial where the asset base isn't growing
    fast. FY25 D&A/revenue ratio of 7.7% (284.1 / 3,710) is in line.


  # Terminal growth
  terminal_growth: 0.025
  terminal_growth_rationale: >
    GDP-adjacent (Australian long-run nominal trend) for a mature
    industrial in a developed-market context. Section 9.7 demographic
    trajectory consideration: a structurally aging Australia could
    pull terminal nominal growth toward 2.0%, but the explicit-
    horizon is short enough (5 years) that the demographic shift
    sits beyond it.

  # Cost-of-equity / WACC method and selection (layer 2).
  wacc_method:

      equity_risk_premium: 0.0500
      equity_risk_premium_rationale: >
        Damodaran-style mature-Australia ERP. Between implied global-
        mature mid-point (~4.6%) and Australian historical (~5.5%).
        Modest country-risk premium over US base (~50bps) baked in.


      # beta_selected removed 23 Aug 2026 (batch 3, item 12b): it held a
      # second copy of `beta` above, and the translator only ever read it as
      # a fallback that never fired. Two homes for one judgement is how
      # `beta` gets updated and the copy does not — the exact gap check 3
      # documented as invisible to it. The selection reasoning stays below.
      beta_selected_decided_on: 2026-07-25
      beta_selected_status: decided_owner_ratified
      beta_selection_decision: |
        DECISION 25 Jul 2026 (Stephen, ratified). beta = 1.10, on a real-gearing peer
        triangulation:
          - Unlevered the comparable equity betas at REAL gearings (Orica D/E 0.18,
            Yara 0.36, ICL 0.30; tax 30/23/30%) -> asset beta ~0.93 (ASX-200) /
            ~0.98 (MSCI-World).
          - Re-levered at DNL's D/E 0.28 (net debt 1,810 / equity = 1,770m x 3.61)
            -> 1.11 (ASX) to 1.17 (MSCI-World).
          - Shaded to the TOP of a 1.05-1.10 reasoned range for DNL's lowest-in-set
            operating leverage (~78% contracted book + long US gas contract) and
            contract-dampened revenue cyclicality. 1.10 = mildly conservative.
        SUPERSEDES the earlier "triangulation gives 0.96-1.05, excludes 1.10" note:
        that rested on overstated MOCK peer gearings (0.45/0.35/0.40 in
        ui_prototypes/_generator/beta_data.py, internally inconsistent with their own
        mfin). With real gearings DNL sits mid-to-upper on leverage, so beta holds
        1.05-1.10 rather than falling to ~1.0. Peer gearings here are public estimates
        (Orica net debt / Yara market cap to be firmed) pending Ben's rigorous EODHD
        pull; robust to sensitivity (world-basis beta 1.11-1.19 across DNL D/E 0.19-0.32).
      beta_selection_rationale: |
        Selected via peer-triangulation per §3.5.3. Peer table
        (indicative β values; full EODHD pull pending for refresh):
          Orica (ASX:ORI):       ~1.05 — comparable peer (direct industry; mining-services)
          Yara (OSLO:YAR):       ~1.20 — comparable peer (ammonia / fertiliser)
          ICL (NYSE:ICL):        ~1.10 — comparable peer (specialty chemicals + mining)
          Sasol (JSE:SOL):       ~1.45 — EXCLUDED (energy + petrochemicals; different archetype)
          DNL (subject):         0.36 measured (UNRELIABLE; window too short)

        Comparable cluster ORI / YAR / ICL: β ~1.0-1.2, midpoint 1.10.
        DNL's franchise mix closest to Orica but more US-weighted with
        long-term US gas contract advantage reducing near-term margin
        volatility — supports anchor at cluster midpoint.

        β_selected = 1.10. Replaces v0.5 estimate of 1.15 (derived
        from pre-demerger IPL ASX200 regression plus modest uplift but
        did not formally peer-triangulate).

        Re = 4.30% + 1.10 × 5.00% = 9.80% (vs v0.5 estimate 10.05%).
        Modest 25bps reduction; WACC moves from 8.82% to ~8.68%.
        Per-share value impact: ~+AUD 0.05 (positive but immaterial
        vs scenario asymmetry of AUD 2.31 to AUD 0.57).


      beta_refresh_action: |
        Ben to provide EODHD fundamentals exports for ORI, YAR, ICL when
        convenient. β_selected likely to stay near 1.10 but worth
        verifying against the same data basis as the WBC peer pull
        (15 June 2026).


      # Active β for valuation
      beta: 1.10
      beta_rationale: >
        Per §3.5.3 peer-triangulation discipline (v0.6, 17 June 2026
        backport). Cluster midpoint of Orica / Yara / ICL ~1.0-1.2;
        midpoint 1.10. See beta_selection_rationale block above.


      cost_of_debt_pretax: 0.0600
      cost_of_debt_pretax_rationale: >
        AUD investment-grade BBB-tier corporate spread ~170bps over
        10-year sovereign. IPL pre-demerger BBB+/Baa1; post-demerger
        DNL likely BBB given smaller scale and concentrated cyclical
        exposure.

