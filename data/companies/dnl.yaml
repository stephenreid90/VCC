  # --- Per-year engine overlays (methodology §11). Structure mirrors the
  # revenue chain: `baseline` is the Muddle Through operating build (the workbook
  # v6 per-year glides); `by_scenario` holds only the scenario-conditional deltas
  # (from dnl_scenarios_comparison_v4 Inputs sheet, rows 12-14). The resolver
  # translator.engine_overlays_from_data applies the deltas as a PARALLEL SHIFT
  # across the five explicit years (owner decision 12 Aug 2026): margin_delta_pp
  # added to every explicit-year margin, capex_delta_pp to every explicit-year
  # capex; terminal_growth is set absolutely. The stub (base year) is unshifted.
  # MT's deltas are zero, so MT resolves to the audited v6 build unchanged.
  #
  # NB: stub_tax_rate + tax_rate_glide are NOT here — they are derived by
  # translator.tax_bridge_from_data (see the tax_bridge block below).
  engine_overlays:
    baseline:
      base_ebit_margin: 0.141              # workbook B10
      margin_transformation: [0.006, 0.018, 0.02, 0.02, 0.02]   # B45..B49 (cum pp)
      margin_gas_rolloff: [0.0, 0.0, -0.005, -0.01, -0.015]     # B52..B56 (cum pp, <=0)
      capex_pct_stub: 0.08                 # B12 (transition)
      capex_pct: [0.08, 0.08, 0.07, 0.07, 0.07]                 # B12 (Y1,Y2), B11 (Y3..Y5)
      da_pct_revenue: 0.073                # B13
    by_scenario:
      # margin_delta_pp / capex_delta_pp are parallel shifts vs the baseline path;
      # terminal_growth is absolute (B77 base 0.025 + the comparison's delta).
      muddle_through:                     {margin_delta_pp:  0.000, capex_delta_pp: 0.00, terminal_growth: 0.0250}
      orderly_convergence:                {margin_delta_pp:  0.005, capex_delta_pp: 0.00, terminal_growth: 0.0275}
      ai_productivity_lag:                {margin_delta_pp:  0.005, capex_delta_pp: 0.00, terminal_growth: 0.0225}
      fragmentation:                      {margin_delta_pp: -0.030, capex_delta_pp: 0.00, terminal_growth: 0.0225}
      disorderly_climate_crystallisation: {margin_delta_pp: -0.030, capex_delta_pp: 0.03, terminal_growth: 0.0175}
      stagflation_persists:               {margin_delta_pp: -0.075, capex_delta_pp: 0.00, terminal_growth: 0.0225}

  # --- Tax Bridge (workbook Tax Bridge sheet; migrated 2026-08-12). INPUTS ONLY:
  # the FY26 effective rate (B59), the per-jurisdiction statutory rates (C5-C7,
  # keyed to the geographic_concentration region names so the revenue WEIGHTS are
  # DERIVED, not restated), and the gap-closing glide fractions (E12-E16). The
  # blended statutory rate (D8) and the per-year tax glide (B12-B16) are derived by
  # translator.tax_bridge_from_data and exposed as auditable steps — never stored
  # (they previously sat in engine_overlays as stored-derived values; removed). ---
  tax_bridge:
    effective_tax_rate: 0.225            # B59: FY26 effective (management guidance midpoint 20-25%)
    statutory_rate_by_region:            # C5-C7; revenue weights derived from geographic_concentration
      United States: 0.26                # Dyno Nobel Americas (US federal + state blended)
      Australia: 0.30                    # Dyno Nobel Asia Pacific (AU statutory)
      Rest of World: 0.27                # Dyno Nobel EMEA & LATAM (blended)
    glide_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]   # E12-E16: fraction of the effective->statutory gap closed
