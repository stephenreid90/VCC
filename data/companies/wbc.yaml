      peak_cycle_bps: 75
      benign_cycle_bps: 5
      basis: bps_per_annum_average_loans
      commentary: >
        Westpac's through-cycle anchor sits at the low end of Big Four
        range (15-25bps), reflecting mortgage-book weighting (mortgages
        run lower loss rates than business book). Current 1H26 annualised
        10bps (= 443m / 1H avg loans ~875bn × 2) is benign-cycle
