# --- Layer-2 method / selection (SSOT protocol §3; split 2026-08-11). ---
# WBC is a bank: valued on the cost of equity, so normalised_baseline carries
# only the Ke method (no FCFF margin/capex/terminal fields). Observed inputs
# (Rf, measured beta, peer betas) live in data/financials/wbc.yaml.
normalised_baseline:
  coe_method:
    # Bank-specific Ke (methodology §15.2). Single-Ke discipline: one rate,
    # held across scenarios (scenarios differ in cash flows, not the rate).
    equity_risk_premium: 0.0500
    equity_risk_premium_rationale: >
      Damodaran-style mature-Australia premium (same as §3.5.2).
    # beta_selected removed 23 Aug 2026 (batch 3, item 12b): it held a
    # second copy of `beta` above, and the translator only ever read it as
    # a fallback that never fired. Two homes for one judgement is how
    # `beta` gets updated and the copy does not — the exact gap check 3
    # documented as invisible to it. The selection reasoning stays below.
    beta_selection_rationale: |
      Selected via peer-triangulation per §15.2(c). Measured β carries
      material statistical noise; mechanical use of the subject
      company's measured value is unsound. Peer table:

        | Bank | Measured β | Notes |
        | CBA  | 0.80       | Closest large-cap retail-mortgage comparable; franchise leader |
        | MQG  | 0.88       | Diversified investment bank — markets / asset mgmt dilutes banking comparability |
        | WBC  | 0.73       | Subject company |
        | NAB  | 0.72       | Closest pure-business-bank comparable |
        | ANZ  | 0.57       | Outlier — institutional / international revenue dilution; recent Suncorp integration period disrupting price series |

      Outlier identification: ANZ at 0.57 sits well below the cluster
      and is excluded as an unsound peer. MQG at 0.88 is a different
      archetype (markets, asset management, commodities trading) and
      is informative but not directly comparable.

      Comparable peer cluster: CBA / NAB / WBC at 0.72-0.80, midpoint
      0.75. WBC's measured 0.73 sits at the bottom of the comparable
      cluster. The franchise-mix logic for placement: WBC's mortgage-
      book scale and recent business-rebuild position it close to NAB
      (same retail-and-business mix) and CBA (similar funding profile,
      weaker ROE) — there is no franchise-specific reason for it to be
      more defensive than NAB.

      β selected = 0.75 (cluster midpoint of comparable peers). This
      is a 2bp uplift to WBC's measured value, modest but
      methodologically explicit. Re = 4.30% + 0.75 × 5.00% = 8.05%
      (vs measured-β-mechanical 7.95%).
    peer_cluster_midpoint: 0.75
    peer_cluster_low: 0.72
    peer_cluster_high: 0.80
    beta: 0.75
    beta_rationale: >
      Active beta for valuation; a 2bp uplift on WBC's measured 0.73 to the
      comparable-peer (CBA/NAB/WBC) cluster midpoint. Placement per
      beta_selection_rationale.
    single_ke_discipline: true
    discount_rate_basis: >
      Flows discounted at the cost of equity (bank archetype):
      Re = Rf + beta x ERP = 4.30% + 0.75 x 5.00% = 8.05% (computed by the
      engine, not stored). Held constant across scenarios per §15.2(d). Sits
      ~90bps below the archetype initial mid-point (~8.93%) because the
      peer-implied beta range is materially below the archetype's initial 0.85
      floor; the peer evidence justifies revising the archetype anchor (see
      australian_major_banks.yaml).

  bank_build:
    # Bank operating build (methodology §15): residual-income / DDM valuation.
    # Sourced from analyses/wbc/valuations/wbc_muddle_through_valuation_v4_formulas.xlsx
    # (Muddle Through baseline) and wbc_scenarios_comparison_v2.xlsx (the six worlds).
    # Standing rule 1: industry anchor and company-position offset are SEPARATE rows;
    # the applied value is derived. The engine consumes this block; nothing is stored
    # that the engine can derive.
    timing:
      stub_years: 0.35          # 1H26 close (31 Mar 2026) to FY26 end (30 Sep 2026)
      horizon_years: 5          # FY27-FY31 explicit
      aiea_y1_time_factor: 1.18 # FY27 average-balance offset from the 1H26-average anchor
                                # (stub uses stub_years/2; Y2+ compound at the growth rate)
    income_anchors_1h26:        # AUD m, half-year to 31 Mar 2026, ex Notable items
      net_interest_income: 9763
      non_interest_income: 1521
      operating_expenses: 5830
      credit_impairment: 443
      cash_npat: 3483
    balance_sheet_anchors:      # AUD m, 1H26 close (31 Mar 2026)
      aiea_1h26_average: 1035226
      book_equity: 72825
      at1_hybrid: 8522
      non_controlling_interests: 350
      treasury_shares: 64
      shares_outstanding_m: 3414.9
    forecast_drivers:
      non_interest_income_growth: 0.025
      through_cycle_credit_loss_rate: 0.0018
      effective_tax_rate: 0.30
      dividend_payout_ratio: 0.75
      avg_loans_pct_aiea: 0.77
    aiea_nim_chain:
      shared:
        industry:               # archetype anchors (Big Four system)
          aiea_growth: 0.045
          nim_anchor: 0.0186
        company_offset:         # WBC Five-Forces position vs the archetype
          aiea_growth_offset: -0.0015
          nim_offset: 0.0008
      by_scenario:              # parallel shifts to the industry anchors
        orderly_convergence: {aiea_growth_delta: 0.02, nim_delta_bps: 5}
        muddle_through: {aiea_growth_delta: 0.0, nim_delta_bps: 0}
        ai_productivity_lag: {aiea_growth_delta: 0.0, nim_delta_bps: 0}
        fragmentation: {aiea_growth_delta: -0.005, nim_delta_bps: 0}
        disorderly_climate_crystallisation: {aiea_growth_delta: -0.005, nim_delta_bps: 0}
        stagflation_persists: {aiea_growth_delta: -0.02, nim_delta_bps: -20}
    overlays:
      baseline:                 # per-year glides: [stub, Y1..Y5] (Muddle Through)
        cost_to_income: [0.516, 0.515, 0.51, 0.495, 0.485, 0.48]
        credit_loss_rate: [0.0011, 0.0013, 0.0016, 0.0018, 0.0018, 0.0018]
        nim_applied: [0.019, 0.0192, 0.0193, 0.0194, 0.0194, 0.0194]
        terminal_roe: 0.105
        terminal_growth: 0.035
      by_scenario:
        # y5_cost_to_income re-anchors the CTI glide endpoint (parallel shift so Y5
        # hits the target); credit_loss_delta_bps shifts the loss-rate glide;
        # terminal_roe / terminal_growth are absolute per world.
        orderly_convergence: {y5_cost_to_income: 0.46, credit_loss_delta_bps: -20, terminal_roe: 0.11, terminal_growth: 0.0375}
        muddle_through: {y5_cost_to_income: 0.48, credit_loss_delta_bps: 0, terminal_roe: 0.105, terminal_growth: 0.035}
        ai_productivity_lag: {y5_cost_to_income: 0.475, credit_loss_delta_bps: 0, terminal_roe: 0.105, terminal_growth: 0.0325}
        fragmentation: {y5_cost_to_income: 0.49, credit_loss_delta_bps: 5, terminal_roe: 0.10, terminal_growth: 0.0325}
        disorderly_climate_crystallisation: {y5_cost_to_income: 0.49, credit_loss_delta_bps: 20, terminal_roe: 0.09, terminal_growth: 0.0325}
        stagflation_persists: {y5_cost_to_income: 0.51, credit_loss_delta_bps: 50, terminal_roe: 0.09, terminal_growth: 0.0325}

company_position:
  id: wbc
  name: Westpac Banking Corporation
  ticker: ASX:WBC
  reporting_currency: AUD
  functional_currency: AUD
  functional_currency_rationale: >
    Westpac Banking Corporation parent functional currency is AUD. ASX listing,
    Australian incorporation, AUD-denominated capital structure, primary
    regulator APRA. NZ operations (Westpac NZ) operate in NZD with NZD
    functional currency consolidated to AUD; other overseas operations
    (institutional book) are AUD-functional with USD/GBP transactional exposure
    hedged. The per-segment functional currency block below captures NZ as
    the only material non-AUD operating unit.

  industry_type: bank
  industry_archetype: australian_major_banks
  # This field is what working_capital_intensity_from_data() keys off to
  # exempt WBC BY RULE (not by returning zero) — a bank's current assets and
  # liabilities ARE its business; netting them per the non-cash working-
  # capital formula would be meaningless. See working_capital_treatment.md §3.

  # ---- Consolidated, parent-level blocks ----

  balance_sheet:
    cet1_ratio: 0.1242
    cet1_ratio_level_1: 0.1275
    tier_1_ratio: 0.1428
    total_capital_ratio: 0.2150
    apra_leverage_ratio: 0.0498
    leverage_posture: prudentially_strong
    liquidity: >
      CET1 ratio 12.42% (Level 2) at 31 March 2026, well above the 11.5%
      APRA "unquestionably strong" floor (includes D-SIB surcharge) and
      management's 11.0-11.5% operating target — leaving 90-150bps of
      operating buffer. AT1 outstanding AUD 8.5bn. Total Capital 21.5%.
      APRA leverage 4.98%. LCR and NSFR comfortably above 100%. Position
      supports continued capital returns; buyback completion ongoing.

  capital_allocation:
    dividend_policy: >
      Payout ratio target 70-75% of cash earnings (ex notable items).
      Final and interim ordinary dividends consistent with this range.
      Franking 100% maintained.
    buyback_posture: >
      Off-market buyback completed AUD 1.0bn FY24; ongoing capital
      management via on-market buyback to manage CET1 above management
      target. AUD 581m share buyback executed in FY25; further capital
      management dependent on CET1 evolution.
    m_and_a_posture: >
      Conservative. No material M&A appetite under current management
      (Anthony Miller, CEO from late 2024). Focus is on organic mortgage
      and business banking re-build plus the multi-year technology
      transformation. Suncorp Bank acquisition was ANZ's, not Westpac's.
    reinvestment_rate: 0.27
      # Implied retention rate = 1 - target payout 0.73

  management_and_governance:
    strategy_quality: moderate
    strategy_evidence: >
      Strategic clarity meaningfully improved post-AUSTRAC (2020), post-
      King review (2022), and under Anthony Miller as CEO from late 2024.
      Focus on (i) simplification — Westpac NZ retained but core franchise
      narrowed; wealth largely divested; (ii) technology transformation
      (UNITE program, FY24-FY28); (iii) re-building business banking
      ground lost to NAB / CBA in 2018-2022; (iv) defending #2 mortgage
      share against CBA. Coherent narrative; execution evidence is the
      open question.
    execution_track_record: moderate
    execution_evidence: >
      Mixed. AUSTRAC settlement AUD 1.3bn (2020) and the King review
      damaged the franchise; Anthony Miller turnaround initiated mid-
      2024. Technology re-platforming (UNITE program) is the largest
      single execution risk and has been on schedule through FY25-1H26.
      Mortgage book share has stabilised after losing ground 2022-2024.
      Cost-to-income at 51.7% (1H26 statutory) / 51.7% (ex notable) sits
      mid-pack of the Big Four (CBA ~42%, NAB ~43%, ANZ ~48%) — material
      improvement path exists but execution-conditional.

  esg_and_transition:
    carbon_intensity: >
      Direct Scope 1 / Scope 2 emissions modest (banks are not high-
      emitting operators themselves). Material exposure is in financed
      emissions — lending book to mining, oil & gas, and high-emission
      manufacturing. Westpac has committed to net-zero financed emissions
      by 2050 with interim sector targets. Climate scenario analysis
      disclosed in Annual Report 2025 climate report.
    transition_plan: >
      Sector-by-sector financed-emissions targets; reduced thermal coal
      exposure (target zero direct lending by 2030); managed exit from
      certain oil & gas project lending; growth in sustainability-linked
      loans. Climate Bond Initiative aligned.
    stranded_asset_exposure: >
      Direct stranded-asset exposure low (already exiting thermal coal;
      oil & gas managed down). Indirect exposure via mortgage book in
      climate-vulnerable geographies (flood, bushfire zones) is the
      larger risk. Captured under the climate-RWA-adjustment disruption
      vector at the archetype level.

  scenario_sensitivity_overrides_global:
    energy_transition:
      direction: negative
      magnitude: low_to_moderate
      rationale: >
        Direct fossil-fuel lending small share of book; ongoing managed
        exit. Indirect housing-book climate risk is gradual. Net effect
        of disorderly climate scenario worse than baseline because
        of mortgage-book climate-vulnerable exposure plus business
        book transition costs.
    interest_rate_and_credit_cycle:
      direction: negative
      magnitude: high
      rationale: >
        Bank performance is highly sensitive to credit-cycle scenarios.
        Disorderly climate and stagflation both stress credit losses
        materially; muddle through holds at through-cycle anchor.

  # ---- Segment block ----

  segments:
    - segment: consumer
      industry_archetype: australian_major_banks
      functional_currency: AUD
      revenue_share: 0.37
        # 1H26 cash NPAT proxy for revenue share: 1184 / 3,483 ex notable
      ebit_share: 0.34
      notes: >
        Largest segment by both revenue and capital. Mortgage book is
        the core — AUD 517.7bn Australian housing (incl. AUD 18.5bn
        RAMS). Personal lending small (AUD 9bn). Retail deposit
        franchise.

      market_positions:
        - market: Australian system mortgages
          unit: outstanding_balance
          share: 0.20
          rank: 2
          share_trend:
            direction: stable
            delta_5yr_bps: -150
            narrative: >
              Lost share 2022-2024 in the front-book cashback war (NAB
              + ANZ aggression); stabilised 2025-1H26 as discipline
              returned and Westpac's "Look Wider" repositioning took
              hold. CBA remains #1 at ~25% share; WBC remains comfortable
              #2 at ~20%.

        - market: Australian household deposits
          unit: outstanding_balance
          share: 0.20
          rank: 2
          share_trend:
            direction: stable
            delta_5yr_bps: 0
            narrative: >
              Strong deposit franchise. AUD 615bn Australian retail
              deposits (incl AUD 149bn non-interest-bearing transaction
              accounts). Funding cost advantage from large transaction
              account share.

      moat:
        sources:
          - scale
          - switching_cost
          - distribution
        durability: high
        evidence: >
          Scale: #2 mortgage book and deposit franchise nationally.
          Switching costs: mortgage discharge friction, transaction-
          account stickiness, broker-channel relationships. Distribution:
          national branch network plus mature digital channels (Westpac
          Live app generally well-rated, though typically trailing CBA's
          CommBank app on independent assessments).

    - segment: business_and_wealth
      industry_archetype: australian_major_banks
      functional_currency: AUD
      revenue_share: 0.28
      ebit_share: 0.33
      notes: >
        Business banking re-build. SME + mid-corporate + agribusiness +
        residual wealth. Business loans AUD 238bn Australia. Higher
        margin than mortgages; higher risk weights.

      market_positions:
        - market: Australian business lending
          unit: outstanding_balance
          share: 0.16
          rank: 3
          share_trend:
            direction: gaining
            delta_5yr_bps: 50
            narrative: >
              Lost share to NAB (#1) and CBA's rebuild over 2018-2022.
              Re-investment in business-banker hiring and digital tools
              from FY24 has started to recover share. NAB remains the
              franchise leader with ~21% share.

      moat:
        sources:
          - scale
          - switching_cost
        durability: moderate
        evidence: >
          Scale: #3 in business banking, behind NAB and CBA. Switching
          costs: relationship-banker model, transaction-banking
          integration. Moat is real but less defensible than the
          consumer-segment moat.

    - segment: institutional
      industry_archetype: australian_major_banks
      functional_currency: AUD
      revenue_share: 0.17
      ebit_share: 0.21
      notes: >
        WIB (Westpac Institutional Bank). Large corporate, FI, sovereign,
        markets, transactional banking. Smaller scale than ANZ; similar
        to CBA / NAB. Stable contribution. Higher non-interest income
        share (markets + transaction banking fees).

      market_positions:
        - market: Australian institutional banking
          unit: revenue
          share: 0.20
          rank: 3
          share_trend:
            direction: stable
            delta_5yr_bps: 0

      moat:
        sources:
          - scale
          - relationship
        durability: moderate
        evidence: >
          Long-standing relationships with Australian corporates and
          financial institutions. Less differentiated than ANZ's
          institutional offering; similar to CBA / NAB.

    - segment: new_zealand
      industry_archetype: australian_major_banks
      functional_currency: NZD
      functional_currency_rationale: >
        Westpac NZ operates as RBNZ-regulated NZ subsidiary with NZD
        functional currency. Consolidated to AUD at parent level.
      revenue_share: 0.12
      ebit_share: 0.13
      notes: >
        Westpac New Zealand. Mortgage-dominated retail bank plus business
        banking. AUD 91.6bn loans (NZ residents view AUD 91.6bn = NZD
        109.9bn). RBNZ capital requirements apply. NZ-specific cycle
        moderately correlated with Australia.

      market_positions:
        - market: NZ system mortgages
          unit: outstanding_balance
          share: 0.18
          rank: 3
          share_trend:
            direction: stable
            delta_5yr_bps: -50

      moat:
        sources:
          - scale
          - regulatory
        durability: high
        evidence: >
          Scale: top-four NZ bank. Regulatory: RBNZ BS2A subsidiary
          capital framework is a moat against new entrants.

    - segment: group_businesses
      industry_archetype: australian_major_banks
      functional_currency: AUD
      revenue_share: 0.06
      ebit_share: -0.01
        # Treasury, group costs, eliminations. Small / negative
        # contribution.
      notes: >
        Treasury, group support functions, intra-group eliminations.
        Operating losses typical given allocation of unallocated
        costs. Not a value-creating segment by itself.

  # ---- Five Forces — company-position decomposition per §15.6 / §3.3 ----

  five_forces_company_position:
    buyer_power:
      industry_rating: low_to_moderate
      company_position: at_industry_average
      mechanism: >
        WBC's retail customer base behaves similarly to industry average:
        mortgage book has high sticky retention but front-book
        refinancing cohort is rate-sensitive. Business banking customer
        mix slightly more SME-weighted than NAB, marginally less
        switching pressure than enterprise-corporate-heavy ANZ.
      quantified_impact_bps: 0
      capture_location: "no impact on baseline forecast"

    supplier_power:
      industry_rating: moderate
      company_position: lower_favourable
      mechanism: >
        Strong retail deposit franchise (#2 share by household deposits;
        large non-interest-bearing transaction balances). Funding mix
        is more retail-deposit-weighted than ANZ; closer to CBA but with
        slightly less granular branch coverage. Translates to a structural
        funding-cost advantage of 5-10bps versus the more wholesale-
        funded peers.
      quantified_impact_bps: 8
      capture_location: "NIM trajectory: +8bps structural advantage on funding cost"

    threat_of_new_entrants:
      industry_rating: low
      company_position: at_industry_average
      mechanism: >
        Same D-SIB-protected position as the rest of the Big Four. No
        bank-specific differentiation.
      quantified_impact_bps: 0
      capture_location: "no impact on baseline forecast"

    threat_of_substitutes:
      industry_rating: low_to_moderate
      company_position: at_industry_average
      mechanism: >
        Non-bank mortgage share-loss exposure proportional to mortgage
        book scale — i.e., #2 by absolute size means #2 exposure to
        non-bank flow gains. Westpac NZ benefits / suffers identically.
      quantified_impact_bps: 0

    rivalry:
      industry_rating: moderate
      company_position: higher_unfavourable
      mechanism: >
        Cost-to-income at 51.7% sits mid-pack; CBA at 42% and NAB at
        43% set the pace. Translates to a ~150bps ROE drag versus the
        leaders that the transformation program (UNITE, cost-out
        plan FY26-FY28) is targeted to close. Closure is achievable
        in principle but execution-conditional. Treated as a
        transformation overlay (§3.2) — visible in the EBIT margin
        glide, not the company-position offset itself.
      quantified_impact_bps: -10
      capture_location: "Net structural rivalry drag (residual after transformation overlay)"

    rivalry_subforce_business_banking_rebuild:
      industry_rating: moderate
      company_position: higher_unfavourable
      mechanism: >
        Business banking share-loss to NAB and CBA 2018-2022. Re-build
        from FY24 has stabilised share but has not yet meaningfully
        recovered. Drag on segment growth ~20bps until the rebuild
        closes (estimated FY28).
      quantified_impact_bps: -5
      capture_location: "Growth offset, time-limited 3-5 years"

  net_company_position_offset_summary:
    revenue_growth_offset_bps: -5
    nim_offset_bps: 8
    cost_to_income_overlay_target: "Transformation glide -150bps over FY26-FY28; -200bps total over FY26-FY29"
    rationale: >
      Net structural offset is modest: +8bps NIM advantage from funding
      mix vs -5bps revenue-growth drag from business-banking rebuild +
      -10bps rivalry pressure from cost-to-income gap. The dominant
      forward driver is the transformation overlay, captured in margin
      glide rather than the structural offset.

