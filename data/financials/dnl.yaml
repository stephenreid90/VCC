#
# Formerly Incitec Pivot Limited (IPL); renamed to Dyno Nobel Limited
# in March 2025 following the demerger of the fertilisers business.
# Ticker is now DNL.AU (was IPL.AX). ISIN: AU0000390544.
#
# Source: Ben's data workstream / EODHD fundamentals export, generated
# 22 May 2026. Replaces the earlier indicative snapshot drafted from
# pre-demerger combined-entity disclosures.
#
# Reporting currency: AUD (ASX-listed, Australian corporate entity).
# Fiscal year-end: 30 September.
#
# Functional currency: per-entity per IAS 21 / AASB 121:
#   - Parent (Dyno Nobel Limited): AUD (Australian listed corporate)
#   - US subsidiary (Dyno Nobel Americas): USD (dominant operations)
#   - Australian operations: AUD
# The earlier "consolidated USD functional" position has been refined
# to per-entity treatment per Ben's data workstream review.

