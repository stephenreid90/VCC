# Kept in data/financials/actuals/, not data/financials/: tests/test_ssot_lint.py treats every
# top-level YAML there as a company financials file (it needs share anchors), which this is not.
# Written 20 Oct 2026. Every figure is read from one document:
#   data/financials/historical/evn/2026-08-19 FY26 Appendix 4E and Financial Report.pdf
# (108 PDF pages; "Evolution Mining Annual Financial Report 2026"). Citations give the PDF page
# and the printed page number (printed = PDF - 2), then the table. Units are the report's:
# A$'000 unless stated. Nothing here is estimated. A line marked NOT_FOUND is not in this report.
# A line marked "derived" is arithmetic on two cited figures, shown in full.
# Used by: scripts/check_resource_engine_vs_company.py --fy26-actuals (a check, not the register).
# This file is not data/financials/evn.yaml and is not read by the valuation itself.

