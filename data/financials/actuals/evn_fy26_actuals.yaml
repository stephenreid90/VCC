# ---- Exploration: treatment and FY26 amounts ----
exploration:
  policy: >
    PDF p70 (p68), Note 7(c)(iii) "Exploration and evaluation": expenditure is CAPITALISED per area
    of interest while tenure is current and costs are expected to be recouped, or reserves cannot yet
    be assessed; otherwise expensed. Expensed exploration cash flows are operating; capitalised are
    investing. On a decision to develop, the asset is tested for impairment and moved to mine
    development. No amortisation in the exploration phase.
  segment_placement: >
    PDF p56 (p54), Note 1(a)-(b): "The Group's operational mine sites and exploration are each treated as
    individual operating segments." Exploration has its own segment (EBITDA -13,414, capital nil), so
    site exploration is NOT in any mine's segment EBITDA or mine capital.
  expensed: {value: 12479, source: "PDF p49 (p47), statement of comprehensive income, 'Exploration and evaluation costs expensed (12,479)'; below cost of sales, not in mine operating costs. Same amount is the E&E write-off in Note 7, PDF p67 (p65)"}
  capitalised_additions: {value: 59952, source: "PDF p67 (p65), Note 7 PPE movement table, Exploration and evaluation column, 'Additions 59,952'"}
  transferred_to_mine_properties: {value: -35708, source: "PDF p67 (p65), Note 7, E&E column 'Transfers (35,708)'"}
  carrying_amount_30_jun_2026: {value: 444496, source: "PDF p67 (p65), Note 7, E&E column"}
  in_underlying_ebitda_line: {value: 105652, source: "PDF p10 (p8), 'Corporate, admin, exploration and other costs (excluding D&A) (105,652)' = corporate overheads 93,172 (PDF p60) + exploration expensed 12,479 (+1 rounding)"}

