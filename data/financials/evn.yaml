# Evolution Mining Limited (ASX: EVN) -- layer 1, OBSERVED inputs only.
# Written 20 Oct 2026. Every figure is read from a document in
# data/financials/historical/evn/ (record: _extract_notes_2026-10-20.md, which quotes the
# line each figure came from) or a dated market source. No judgement lives here (D-17);
# the method and selections are in data/companies/evn.yaml. A$ millions unless stated.
# No EODHD feed exists for EVN (Stephen, 20 Oct 2026): this file is hand-built from the
# primary documents, so it is not machine-refreshable yet.

