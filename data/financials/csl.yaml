# Base-year financial snapshot for CSL Limited (CSL).
#
# Three-segment specialty-biopharmaceutical group: CSL Behring (plasma-derived
# therapies), Seqirus (influenza vaccines), Vifor (iron deficiency / nephrology).
#
# Source: disclosed FY25 segment accounts, reverse-engineered from the working
# valuation workbook csl_muddle_through_valuation_v4.xlsx (terminal-capex-consistent
# build). Curated 25 June 2026 to make CSL a first-class data-driven company per
# the engine implementation plan (R1).
#
# Reporting / functional currency: USD throughout (segment financials disclosed in
# USD; the parent is ASX-listed and the share price is AUD). AUD translation is
# applied ONLY at the per-share output line, at spot FX — never inside a segment DCF.
# Fiscal year-end: 30 June.

company_id: csl
fiscal_year: FY2025
fy_end_date: 2025-06-30
reporting_currency: USD
functional_currency: USD
base_year_status: disclosed_accounts_hand_curated
data_source: >
  FY25 disclosed segment accounts (CSL FY25 results) for group and segment
  revenue; 1H26 balance sheet for net debt; market feeds (MarketScreener /
  Yahoo Finance, 21 Jun 2026) for price, FX and 16-analyst consensus; EODHD /
  US Treasury for the cost-of-equity market inputs. Primary sources — NOT the
  valuation workbook (the earlier workbook_reverse_engineered route is retired).
data_generated: 2026-06-25
last_updated: 2026-08-11
last_updated_note: >
  11 Aug 2026 — broke the layer-1 circularity. (1) The per-segment SCENARIO
  ASSUMPTIONS (muddle_through growth paths, growth_shape, margin uplifts + their
  rationales) that had leaked into the `segments` block below moved to
  data/companies/csl.yaml `normalised_baseline.segment_baseline` (layer 2). What
  remains under `segments` here is observed only: disclosed FY25 segment revenue
  and operating margin. (2) Observed values re-attributed to their primary
  disclosures/feeds rather than to csl_muddle_through_valuation_v4.xlsx, and
  base_year_status flipped off `workbook_reverse_engineered`. Numbers are the
  disclosed figures (unchanged); independent MACHINE re-sourcing from Ben's
  EODHD pipeline is still pending — until then this file is primary-cited but
  hand-curated. Prior split: 25 Jul 2026 moved the top-level normalised_baseline
  to layer 2 (design/single_source_of_truth.md §3).

