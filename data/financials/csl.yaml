# Base-year financial snapshot for CSL Limited (CSL).
#
# Three-segment specialty-biopharmaceutical group: CSL Behring (plasma-derived
# therapies), Seqirus (influenza vaccines), Vifor (iron deficiency / nephrology).
#
# Source: disclosed FY25 segment accounts, reverse-engineered from the working
# valuation workbook csl_muddle_through_valuation_v4.xlsx (terminal-capex-consistent
# build). Curated 25 June 2026 to make CSL a first-class data-driven company per
# the engine implementation plan (R1).
#
# Reporting / functional currency: USD throughout (segment financials disclosed in
# USD; the parent is ASX-listed and the share price is AUD). AUD translation is
# applied ONLY at the per-share output line, at spot FX — never inside a segment DCF.
# Fiscal year-end: 30 June.

company_id: csl
fiscal_year: FY2025
fy_end_date: 2025-06-30
reporting_currency: USD
functional_currency: USD
base_year_status: workbook_reverse_engineered
data_source: >
  Disclosed FY25 segment accounts; curated from csl_muddle_through_valuation_v4.xlsx
  (Muddle Through, terminal capex = D&A). Cross-checked to 16-analyst consensus pulled
  via MarketScreener + Yahoo Finance (21 June 2026).
data_generated: 2026-06-25
last_updated: 2026-07-25
last_updated_note: >
  25 July 2026 — layer split per design/single_source_of_truth.md §3. The
  hand-authored `normalised_baseline` block moved to data/companies/csl.yaml
  (layer 2); what remains here is observed data (group financials, balance-sheet
  anchor, market data, share statistics, cost-of-equity market inputs). NOTE:
  base_year_status is `workbook_reverse_engineered` — this layer-1 file is still
  hand-curated from csl_muddle_through_valuation_v4.xlsx, not yet machine-fed, so
  refresh-safety is aspirational until Ben's pipeline supplies it.

# --- OBSERVED GROUP FINANCIALS (layer 1: disclosed accounts) ---
group_financials:
  group_revenue: 15558.0
  group_revenue_rationale: >
    FY25 disclosed group revenue (USD m). Behring 11,158 + Seqirus 2,166 +
    Vifor 2,234 = 15,558. Group EBIT margin ~27.5% after corporate / R&D (a
    derived memo, recomputed from the segment operating results rather than stored).

# --- OBSERVED BALANCE-SHEET ANCHOR (layer 1) ---
balance_sheet:
  net_debt: 9100.0
  net_debt_rationale: >
    1H26 close (USD m); ~1.8x EBITDA. Deducted in the equity bridge at anchor.

# --- OBSERVED MARKET DATA (layer 1) ---
market_data:
  market_price_aud: 105.53
  market_price_rationale: >
    ~61% below the 52-week high of AUD 269. Implied USD ~69.65 at spot.
  spot_fx_aud_per_usd: 1.5152
  consensus_target_usd: 96.75
  consensus_eps_fy26_usd: 6.28

# --- OBSERVED SHARE STATISTICS (layer 1) ---
share_statistics:
  shares_outstanding: 478.9
  shares_outstanding_rationale: >
    Million shares; FY25 close. Translation to AUD per-share at spot only.

# --- OBSERVED COST-OF-EQUITY INPUTS (layer 1: market data) ---
# Judgement (ERP, beta selection, active beta, discount-rate basis) moved to
# data/companies/csl.yaml `normalised_baseline.coe_method` per
# design/single_source_of_truth.md §3. computed_cost_of_equity DELETED — it was a
# stored layer-3 value (Re = 4.50% + 0.85 x 5.00%); the engine computes it.
coe_observed_inputs:
  risk_free_rate: 0.045
  risk_free_rate_rationale: >
    10-year US Treasury yield (USD anchor), indicative June 2026 level.

  beta_measured: 0.094
  beta_measured_source: >
    EODHD reported beta. UNRELIABLE — CSL's revenue is USD-based while the
    measured beta regresses an AUD-listed price against an AUD index; the
    currency/structure mismatch collapses the measured figure. Discarded
    per §3.5.3; selected via peer triangulation.

  beta_peer_dataset:
    - peer: Grifols
      ticker: BME:GRF
      beta_indicative: 0.85
      inclusion: comparable_peer
    - peer: Takeda
      ticker: TSE:4502
      beta_indicative: 0.75
      inclusion: comparable_peer
    - peer: Sanofi
      ticker: PAR:SAN
      beta_indicative: 0.90
      inclusion: comparable_peer
    - peer: CSL (subject)
      ticker: ASX:CSL
      beta_indicative: 0.094
      inclusion: subject_measured_unreliable

# --- SEGMENTS (industry+company decomposition per §11) ---
segments:
  - segment: csl_behring
    industry_archetype: plasma_derived_therapies
    fy25_revenue: 11158.0
    fy25_or_margin: 0.422
    revenue_share: 0.717
    muddle_through_growth_path: [-0.01, 0.025, 0.045, 0.055, 0.055, 0.055]
    growth_shape: j_curve
    growth_rationale: >
      Behring J-curve: FY26 -1% (Medicare Part D + China trough), recovering
      to the archetype secular 5.5% by FY29. Through-cycle plasma demand 5-7%.
    margin_uplift_cum_fy31: 0.015
    margin_uplift_rationale: >
      +150bps peer-gap closure in Muddle Through; full +250bps reserved for
      Orderly Convergence (benefit-funding consistency, §4.4.1).

  - segment: csl_seqirus
    industry_archetype: vaccines
    fy25_revenue: 2166.0
    fy25_or_margin: 0.474
    revenue_share: 0.139
    muddle_through_cagr: 0.02
    growth_rationale: >
      Mature seasonal influenza-vaccine market. Pandemic / health-disruption
      optionality lifts demand under Disorderly Climate.
    margin_uplift_cum_fy31: 0.01

  - segment: csl_vifor
    industry_archetype: specialty_pharmaceuticals
    fy25_revenue: 2234.0
    fy25_or_margin: 0.491
    revenue_share: 0.144
    muddle_through_cagr: 0.07
    growth_rationale: >
      Iron-deficiency / nephrology franchise (acquired 2022). Faster-growing,
      younger franchise with patent-cliff / substitution exposure over time.
    margin_uplift_cum_fy31: 0.01

