# Impact matrix for the gold_producers archetype (EVN). Written 20 Oct 2026.
# Sparse per architecture spec 10.2. The one quantified driver the resource engine reads is
# real_cost_escalation: percentage points a year ABOVE the scenario's CPI, applied from year 1
# up to the year before the scenario's final (equilibrium) phase starts, after which the
# higher cost LEVEL persists (method paper §6). Price and FX channels are not here: they are
# scenario series (D-99 proposed). No excess_return_defence: for a resource archetype the
# decay horizon is the remaining ore life (D-97 proposed), not a Five Forces band.

industry: gold_producers
archetype_class: resource
version: 2026-Q4-v1
matrix:
- scenario: orderly_convergence
  scenario_version: 2026-Q2-v1
  drivers:
    real_cost_escalation:
      direction: neutral
      magnitude: small
      confidence: moderate
      rationale: >-
        Supply-side normalisation and lower energy prices: AUD mining costs track CPI. No real escalation.
      quantified_override:
        min: 0.0
        mid: 0.0
        max: 0.0
      not_applicable: false
      evidence_refs: []
      governance:
        created_by: stephenreid90@gmail.com
        created_at: '2026-10-20T00:00:00Z'
