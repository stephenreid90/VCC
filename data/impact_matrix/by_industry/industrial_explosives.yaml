        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      risk_free_rate:
        direction: positive
        magnitude: small
        confidence: low
        rationale: >
          Choppy rates with elevated volatility. Central banks face policy
          dilemma between supply-shock tightening and reallocation
          accommodation. Net modestly higher; low confidence reflects the
