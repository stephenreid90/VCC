# Impact matrix for industrial_explosives archetype.
#
# One entry per scenario; drivers populated sparsely per architecture spec
# §10.2 — absent drivers default to neutral / small / not assessed.
#
# Direction: negative | neutral | positive (3-way per §10.2)
# Magnitude: small | moderate | large (3-way per §10.2)
# Confidence: low | moderate | high (joint confidence in direction × magnitude
#             assuming the scenario plays out per §10.2 pinned definition)
#
# Scope: archetype-applicable segment-scope drivers + company-scope drivers
# whose movements are consistent across companies in the archetype.
# Company-specific overrides live in the company file's
# scenario_sensitivity_overrides_global block (e.g. DNL's high operational
# carbon exposure under climate scenarios).

industry: industrial_explosives

matrix:

  # ----------------------------------------------------------------------
  - scenario: muddle_through
    scenario_version: "2026-Q2-v1"
    drivers:

      volume_growth:
        direction: neutral
        magnitude: small
        confidence: moderate
        rationale: >
          Mining-customer capex cycle continues at current pace. Demand growth
          tracks the slow grind of global mining volumes — GDP-adjacent with
          modest cyclical variation. No catalyst for material movement either
          direction.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      input_cost_pass_through:
        direction: neutral
        magnitude: small
        confidence: moderate
        rationale: >
          Long-term gas and ammonia contracts plus established customer
          relationships maintain established pass-through dynamics. No
          new stress on the cost transmission mechanism.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      risk_free_rate:
        direction: neutral
        magnitude: small
        confidence: high
        rationale: >
          Real rates settle ~1% in the Muddle Through baseline and stay
          there — no further movement from current conditions. This is the
          baseline anchor against which other scenarios are compared.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_growth_rate:
        direction: neutral
        magnitude: small
        confidence: moderate
        rationale: >
          Long-term mining-customer demand approximately GDP-adjacent.
          Demographic adaptation in Australia and US handled at current
          pace; terminal trajectory consistent with cost-of-capital
          convergence over the fade period.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_roic:
        # Created 17 Sep 2026 under D-42. This scenario had NO terminal_roic
        # driver, so the excess return it asserts was emergent from the capex
        # rule, the working-capital intensity and terminal growth, and had never
        # been assessed by anyone. Direction and magnitude below RECORD what the
        # model already does, read through the project's own translation table
        # (positive-large maps to +200bp on a rate driver, and the measured excess
        # is 254bp over WACC on the whole capital base) -- they are not
        # yet a view from the moat work, which is why confidence is low and why
        # declared_terminal_return is deliberately ABSENT. Supplying that rate is
        # Stephen's call; leaving it out keeps the reconciliation live rather than
        # making it vacuous by copying the engine's own answer back at it.
        direction: positive
        magnitude: large
        confidence: low
        rationale: >
          The central case, and the headline Denali valuation.
          Recorded rather than chosen: the terminal return this scenario
          asserts sits 254bp above the WACC on the whole capital
          base, which on the project's translation scale is a large positive
          movement, not the small one the only previously-assessed scenario
          declared. The defended exception below carries the parts that do not
          depend on a scenario view -- the barrier-bearing moat sources, the
          decay horizon from the Five Forces reading, the named threat and the
          sensitivity. The rate itself awaits the moat work.
        not_applicable: false
        evidence_refs: []
        excess_return_defence:
          # Scale and switching cost only. The resource leg is a RENT under
          # D-43a -- gas contracts, dated in the margin path under D-40 -- and a
          # rent expiring inside the explicit period cannot hold up a
          # ten-to-fifteen year horizon.
          moat_sources:
            - scale
            - switching_cost
          decay_horizon:
            years_low: 10
            years_high: 15
            basis: >
              Five Forces ratings for industrial explosives -- threat of new
              entrants low, rivalry high, substitutes low -- read per section
              12: entrant threat sets the barrier height and rivalry the speed
              the excess is competed away. Those three ratings are
              archetype-level and do not move by scenario, which is why the
              band is the same as the Orderly Convergence block. A scenario
              that shortens the horizon should say so and why, as the
              Disorderly Climate block does.
          named_threat: >
            Orica competitive response. The scale and switching-cost legs both
            rest on installed on-site capacity and customer integration, and
            Orica is the one competitor able to match both.
          sensitivity: >
            Halving the decay horizon to five to seven years is the test the
            Disorderly Climate block uses and section 12 puts that at a 15-20%
            terminal-value impact. Sized properly once the declared rate
            exists, since the sensitivity is a sensitivity OF that rate.

  # ----------------------------------------------------------------------
  - scenario: orderly_convergence
    scenario_version: "2026-Q2-v1"
    drivers:

      volume_growth:
        direction: positive
        magnitude: moderate
        confidence: moderate
        rationale: >
          Global mining-customer capex cycle healthy under coordinated
          climate transition and broad-based growth recovery. Transition-
          mineral demand (lithium, copper, nickel) particularly supportive.
          Modest positive volume against base.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      price_mix:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Technology product mix (electronic detonators, AI blast design)
          gradually lifts under broader productivity acceleration in mining
          customer base.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      gross_margin:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Input costs (ammonia, gas) normalise; supply chain disruption
          unwinds; modest margin uplift on stabilised cost base.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      risk_free_rate:
        direction: negative
        magnitude: small
        confidence: moderate
        rationale: >
          Real rates ease modestly from Muddle Through baseline (~1%) toward
          ~0.5-0.8% as central banks ease into the convergence. Modest
          tailwind to valuation multiples.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      equity_risk_premium:
        direction: negative
        magnitude: moderate
        confidence: moderate
        rationale: >
          Risk appetite recovers as macro and geopolitical tensions resolve.
          Cyclical industrial ERP compresses meaningfully toward long-run
          average.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_growth_rate:
        direction: positive
        magnitude: small
        confidence: low
        rationale: >
          Modestly higher long-run growth under coordinated transition.
          Low confidence because terminal trajectory depends heavily on
          African skills-development and migration corridor progress that
          is presumed in Orderly Convergence but not yet realised.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_roic:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Slightly above cost-of-capital convergence target via productivity
          surprise sustaining excess returns marginally longer. Subject to
          §11.4.2 convergence discipline — terminal ROIC should still
          approach WACC over the fade period. The §10.6 rule 2 defended
          exception that used to be stated here in prose is now declared
          structurally in excess_return_defence below (D-42, D-58): a
          horizon written as a sentence cannot be validated, and §12 puts
          this quantity at 15-20% of terminal value.
        not_applicable: false
        evidence_refs: []
        excess_return_defence:
          # The resource leg is deliberately NOT listed. D-43a separated a rent
          # from a barrier: Denali's gas contracts confer a cash advantage with
          # an end date, already dated in the margin path under D-40, and a
          # terminal excess return cannot be defended on something that expires
          # inside the explicit period. Scale and switching cost are the legs
          # that stop a rival taking the business.
          moat_sources:
            - scale
            - switching_cost
          decay_horizon:
            years_low: 10
            years_high: 15
            basis: >
              Five Forces ratings for industrial explosives — threat of new
              entrants low, rivalry high, substitutes low — read per §12:
              entrant threat sets the barrier height, rivalry the speed the
              excess is competed away. High rivalry against a low entrant
              threat is what puts the band at ten to fifteen years rather
              than beyond it.
          named_threat: >
            Orica competitive response. The scale and switching-cost legs both
            rest on installed on-site capacity and customer integration, and
            Orica is the one competitor able to match both.
          sensitivity: >
            Halving the fade-period extension still preserves positive
            scenario value, so the excess return is not load-bearing for the
            sign of this scenario's result.
          declared_terminal_return: 0.0913
          declared_terminal_return_basis: >
            Derived from this block's OWN declared movement rather than chosen
            afresh: terminal_roic is direction positive, magnitude small, and
            the project's translation table (RATE_DELTA_BPS in translator.py)
            maps positive-small on a rate driver to +25bp. The baseline it is a
            delta from is the cost-of-capital convergence target named in the
            rationale above, i.e. the WACC of 8.877%, giving 9.13%. Recorded so
            the declared view can be reconciled against what the capital build
            actually produces. It does not reconcile — see the handover — and
            that mismatch is the finding, not a defect in this field.
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

  # ----------------------------------------------------------------------
  - scenario: stagflation_persists
    scenario_version: "2026-Q2-v1"
    drivers:

      volume_growth:
        direction: negative
        magnitude: moderate
        confidence: high
        rationale: >
          Mining-customer capex slows under restrictive financial conditions.
          High real rates compress new mine development; deferral of expansion
          decisions reduces explosives demand growth. Recession in advanced
          economies amplifies the slowdown for 1-2 years inside the horizon.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      input_cost_pass_through:
        direction: negative
        magnitude: large
        confidence: high
        rationale: >
          Critical driver under Stagflation. Sustained energy / ammonia
          price spike of 40-60% above baseline. Supplier power moderate
          (per §7.4 archetype) blocks full pass-through to mining customers
          under sustained input inflation — Ben's-bot worked example.
          DNL's long-term gas contracts partly insulate ~70% of US gas
          exposure through 2028 but ammonia spot exposure and Australian
          gas costs compress margins materially. Critical to the scenario's
          impact on industrial explosives profitability.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      gross_margin:
        direction: negative
        magnitude: large
        confidence: high
        rationale: >
          Direct flow-through from input_cost_pass_through. Cost pressure
          exceeds contract protection; margin compression material. Mining
          customers themselves under cost pressure resist explosives
          price increases.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      sga_pct_revenue:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Wage inflation and operating cost pressure feed into SG&A.
          Some labour-cost containment from AI augmentation but
          overwhelmed by broader cost-base inflation.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      maintenance_capex_pct_revenue:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Deferred maintenance capex catches up; replacement cycle costs
          inflated. No new growth capex inside horizon.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      working_capital_days:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Customer payment cycles lengthen modestly under stress;
          inventory builds as demand softens; working capital tied up
          modestly increases.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      risk_free_rate:
        direction: positive
        magnitude: large
        confidence: high
        rationale: >
          Real rates settle 2-3% (vs Muddle Through 1%). Central banks
          forced to maintain restrictive policy through horizon. Material
          headwind to valuation multiples and to capital-intensive
          industrial economics.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      equity_risk_premium:
        direction: positive
        magnitude: moderate
        confidence: high
        rationale: >
          Risk appetite contracts materially. Cyclical industrials face
          higher ERP demanded by investors. Compounds the real-rates
          headwind for valuation.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      beta:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Mining-customer cyclicality drives higher correlation with broader
          industrial cycles during recession. Beta drifts upward modestly.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_growth_rate:
        direction: negative
        magnitude: small
        confidence: moderate
        rationale: >
          Long-run trend growth shaded down modestly given structural damage
          to capital formation cycles and skilled-migration constraints
          binding earlier.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

