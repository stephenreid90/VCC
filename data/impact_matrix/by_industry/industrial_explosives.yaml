  - scenario: fragmentation
    scenario_version: "2026-Q2-v1"
    drivers:

      volume_growth:
        direction: negative
        magnitude: small
        confidence: moderate
        rationale: >
          Bloc bifurcation creates uneven mining-customer demand. China-
          aligned bloc grows faster (positive for transition-mineral
          mining in their bloc); US-aligned bloc slower. Net for industrial
          explosives consolidated demand is modestly negative due to
          duplication-cost drag on the US-aligned customer base.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      price_mix:
        direction: negative
        magnitude: small
        confidence: low
        rationale: >
          Cross-bloc product trade constrained; price discovery less
          efficient; pricing of premium technology products under
          pressure where Tier 2 competitors not subject to same trade
          restrictions undercut.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      gross_margin:
        direction: negative
        magnitude: moderate
        confidence: moderate
        rationale: >
          Supply-chain duplication costs (regional manufacturing capacity,
          parallel logistics, bloc-aligned ammonia / gas sourcing).
          Ammonium nitrate cross-bloc trade restrictions raise effective
          input costs.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      input_cost_pass_through:
        direction: negative
        magnitude: moderate
        confidence: moderate
        rationale: >
          Regional input price fragmentation makes pass-through harder
          to negotiate with customers when contract structures haven't
          anticipated bloc-aligned pricing. Lag effect for several years
          while contracts reset.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      maintenance_capex_pct_revenue:
        direction: positive
        magnitude: moderate
        confidence: moderate
        rationale: >
          Supply-chain duplication requires capex in bloc-internal
          capacity. Includes both maintenance and capacity additions
          to replace cross-bloc supply.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      risk_free_rate:
        direction: positive
        magnitude: small
        confidence: moderate
        rationale: >
          Structurally higher rates from inflationary effects of supply-
          chain duplication. Smaller move than Stagflation.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      equity_risk_premium:
        direction: positive
        magnitude: moderate
        confidence: high
        rationale: >
          Geopolitical risk premium rises materially. Multinationals with
          cross-bloc operations re-rated lower; industrial explosives sits
          in this category given DNL's US-Australia footprint and global
          input dependencies.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      country_risk_premium:
        direction: positive
        magnitude: moderate
        confidence: moderate
        rationale: >
          Cross-bloc operations face elevated jurisdiction risk. For an
          ASX-listed company with US-dominant operations and bloc-aligned
          customer base, country-risk premium rises modestly to materially.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      terminal_growth_rate:
        direction: negative
        magnitude: small
        confidence: moderate
        rationale: >
          Structurally inferior world to pre-fragmentation. Long-run growth
          drag from inefficient resource allocation; partial offset from
          China-aligned bloc growing faster, but for consolidated industrial
          explosives the net is negative.
        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

