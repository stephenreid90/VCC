        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      growth_capex_pct_revenue:
        direction: positive
        magnitude: moderate
        confidence: moderate
        rationale: >
          Transition-aligned capacity additions (green ammonia, transition-
