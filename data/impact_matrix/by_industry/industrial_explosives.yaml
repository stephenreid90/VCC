        not_applicable: false
        evidence_refs: []
        governance:
          created_by: tara@reidadvisory.net
          created_at: 2026-05-17T10:00:00Z

      input_cost_pass_through:
        direction: negative
        magnitude: moderate
        confidence: moderate
        rationale: >
          Carbon-driven cost increases harder to pass through to mining
          customers themselves under cost pressure from their own carbon
