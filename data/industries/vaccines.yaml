industry_archetype:
  id: vaccines
  name: Vaccines (Influenza, Routine Immunisation, Specialty)
  version: 2026-Q2-v1

  # D-72 / D-37 (14 Oct 2026, Stephen's ruling): the segment's nominal growth
  # tracks nominal GDP plus a fixed gap calibrated to the steady-state rate CSL's
  # segment block types for each scenario. Stephen asked for US real GDP as the
  # base; only two of the six scenario files carry real_gdp_growth_us, so the base
  # is world real GDP + advanced CPI until scenario development adds the US series
  # to all six (then change `series` here and rerun -- nothing else). ONE
  # nominal series, deliberately: splitting it into volume (GDP + gap) and price
  # (CPI + healthcare spread) needs a healthcare-inflation view nobody has
  # written down yet, and typing a spread to make the split would invent a
  # number. The split is a follow-up for scenario development / Five Forces.
  # Written into data/scenarios/*.yaml by scripts/derive_macro_driver_paths.py.
  required_macro_drivers:
    - variable: seasonal_vaccines_nominal_growth
      derivation:
        method: spread
        series: [real_gdp_growth_us, cpi_inflation_advanced]
        anchor:
          company: csl
          path: normalised_baseline.segment_fcff.by_scenario.{scenario}.seqirus_cagr
  archetype_class: biopharmaceutical_specialty
  # 15 Oct 2026 (item (c), step 1): price rate = advanced CPI (Stephen's ruling). Volume
  # is the nominal driver less this. A healthcare premium over CPI is a later decision.
  segment_price_series: cpi_inflation_advanced

  # D-78 / D-79 (14 Oct 2026): declared EMPTY, and that is the answer, not a gap.
  # A segment-valued company's growth chain has no scenario-invariant terms: the
  # segment grows at this archetype's declared series plus a company offset that
  # is the typed path less its own steady state, zero by construction at year 10
  # (translator.segment_growth_path_from_data). So nothing is current-cycle by
  # declaration; the offset expires inside the explicit period on its own.
  # Terminal growth is DERIVED (D-79): the revenue-weighted mean of the segment
  # series at year 10, capped at scenario nominal GDP
  # (translator.segment_terminal_growth_from_data). Ratified by Stephen 14 Oct 2026.
  growth_chain_terms: []

  geography: global

  submarkets:
    - region: United States
      weight: 0.40
      notes: >
        Largest market. Mix of government procurement (Section 317 program,
        Vaccines for Children) and private market (employer-sponsored
        insurance, retail pharmacy). Trump administration RFK Jr-era policy
        creating uncertainty on routine immunisation schedules.

    - region: Europe + UK
      weight: 0.25

    - region: Rest of world (incl Australia, Asia, Latin America)
      weight: 0.35
      notes: >
        Includes WHO procurement, national immunisation programs, private
        market in middle-income countries.

  five_forces:
    buyer_power:
      rating: moderate
      rationale: >
        Concentrated payers (governments, health systems, large employers).
        Influenza vaccine has annual demand cycle with seasonal procurement.
        Public-health framing supports volume but pricing pressure
        material.

    supplier_power:
      rating: low
      rationale: >
        Manufacturing inputs (eggs for traditional vaccines, cell culture
        media for cell-based, mRNA reagents) generally commodity. Some
        specialised adjuvant supply constraints but not severe.

    threat_of_new_entrants:
      rating: low_to_moderate
      rationale: >
        Lower entry barriers than plasma-derived therapies but still
        material. Manufacturing scale + regulatory approval + real-world
        data + distribution network all required. New entrants in
        last decade primarily mRNA platforms (Moderna, BioNTech) leveraging
        COVID-era capability.

    threat_of_substitutes:
      rating: low_to_moderate
      rationale: >
        Influenza vaccine has no true substitute (alternative is no
        vaccination). Within product category, mRNA-based influenza
        vaccines emerging as alternative technology.

    rivalry:
      rating: moderate
      rationale: >
        Oligopolistic global structure: CSL Seqirus, Sanofi vaccines, GSK
        vaccines, Pfizer vaccines, Moderna. Annual procurement cycles
        create periodic pricing pressure. Strain-matching capability and
        real-world effectiveness data are key differentiators.

  cyclicality:
    cycle_length_years: 5
    current_cycle_phase: mid
    amplitude: moderate
    rationale: >
      Annual seasonal demand cycle. Procurement volumes vary with
      government decisions year-on-year. mRNA platform emergence is a
      structural change.

  input_dependencies:
    critical_inputs:
      - "Embryonated eggs (traditional manufacturing)"
      - "Cell culture media (cell-based manufacturing)"
      - "mRNA reagents (mRNA platforms)"
      - "Adjuvants"
    supply_risk: low_to_moderate
