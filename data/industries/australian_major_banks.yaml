industry_archetype:
  id: australian_major_banks
  name: Australian Major Banks (ADI-regulated retail and business banking)
  version: 2026-Q2-v1
  archetype_class: bank

  geography: domestic_au_nz

  submarkets:
    - region: Australian housing (mortgages)
      weight: 0.55
      notes: >
        The structural anchor of all Big Four balance sheets. Dominated by
        owner-occupier and investor mortgages; broker channel ~50-60% of
        new origination; back-book is sticky with high switching frictions
        (refinancing cost, broker incumbency, deposit/transaction-account
        bundling). Risk-weighted asset density typically 25-35% under
        APRA's revised IRB framework. Pricing tension between front-book
        (competitive on rate) and back-book (margin extraction) is the
        single most important industry profitability dynamic.

    - region: Australian business and commercial lending
      weight: 0.18
      notes: >
        SME + mid-corporate. Higher risk weights (typically 70-90%) but
        also higher margins. NAB's traditional strength; CBA has been
        rebuilding; WBC, ANZ mid-pack. Mining-services and agribusiness
        sub-segments material at NAB and Rabobank.

    - region: Australian institutional / wholesale
      weight: 0.12
      notes: >
        Large corporate, sovereigns, financial institutions. Markets and
        FX. ANZ has the strongest franchise; CBA / WBC weaker; NAB
        intermediate. Capital-light fee businesses but lower returns on
        capital deployed (transaction banking, debt capital markets).

    - region: New Zealand
      weight: 0.10
      notes: >
        All Big Four operate via NZ banking subsidiaries (ASB / CBA,
        BNZ / NAB, Westpac NZ / WBC, ANZ NZ). RBNZ-regulated. Smaller
        scale than Australia but contributes ~10-15% of group profit.
        Mortgage-dominated. NZ-specific cycle moderately correlated
        with Australia.

    - region: Other (rest-of-world institutional, wealth, other)
      weight: 0.05
      notes: >
        Residual offshore institutional (mainly ANZ Asia / Pacific),
        residual wealth management post-divestments. Material at ANZ;
        de minimis at the others.

  five_forces:
    buyer_power:
      rating: low_to_moderate
      rationale: >
        Households (retail mortgage and deposit customers) have low
        switching propensity: relationship inertia, transaction-banking
        bundling, mortgage-discharge friction, and broker-channel
        re-anchoring. The exception is front-book mortgage refinancing —
        the cohort that does shop around drives the marginal price
        outcome. Business customers have moderate switching power
        (annual reviews, multi-bank relationships standard for SMEs and
        corporates); institutional customers have material power but
        lower volume share. Net: low for retail, moderate for business,
        binding constraint sits in the marginal-mortgage segment.

    supplier_power:
      rating: moderate
      rationale: >
        Deposit-holders are the primary funding "supplier". They have
        switching options between banks (comparator sites, term-deposit
        rate shopping), between bank deposits and superannuation, and
        between at-call and term. Wholesale debt investors (covered
        bond, senior unsecured) price credit spreads daily — moderate
        supplier power on the cost-of-funds side, but the Big Four are
        price-takers within a narrow oligopolistic range. The structural
        constraint is that any one bank cannot push funding cost much
        below the Big Four average without losing share.

    threat_of_new_entrants:
      rating: low
      rationale: >
        APRA's licensing regime, capital requirements (the Big Four are
        all D-SIB-designated with CET1 floors at ~11.5% plus management
        buffer), distribution scale (branch + broker + digital), and the
        funding-cost advantage of established deposit franchises all
        create high barriers. Neo-bank licensing waves (Volt, Xinja, 86
        400) have not produced material competitive disruption; the
        successful new entrants have been narrow-product (BNPL via
        non-bank lenders, neo-deposit via Up / 86 400 / Judo). The
        oligopoly is durable on a 5-10 year view.

    threat_of_substitutes:
      rating: low_to_moderate
      rationale: >
        Non-bank mortgage lenders (Pepper, Resimac, Liberty, La Trobe)
        warehouse-funded, take share when bank credit serviceability
        constraints bind — the post-2018 RC tightening drove a marked
        non-bank share gain in mortgage refinancing. Superannuation
        funds substitute for term deposits over long horizons (the
        $4tn super pool is a structural drag on retail term-deposit
        funding). Fintech payments (Apple Pay, Square / Block, PayID
        infrastructure) substitute for some transaction-account
        revenue but not the underlying funding base. Net effect:
        gradual margin erosion in specific segments rather than
        existential displacement.

    rivalry:
      rating: moderate
      rationale: >
        Oligopolistic among the Big Four (CBA ~25% mortgage share,
        WBC ~20%, NAB ~14%, ANZ ~14% plus regional banks at 5-10%
        combined). Pricing discipline holds in benign periods —
        Standard Variable Rate moves are usually within bps of each
        other and tied to RBA cash-rate decisions. Discipline breaks
        under share-loss pressure: 2022-2024 front-book mortgage
        cashbacks and discounting cost the industry materially. The
        canonical break-pattern is share loss triggering a defensive
        price response that compresses NIM across the cycle.

    rivalry_subforces:
      - sub_dimension: Mortgage pricing
        rating: moderate_to_high
        rationale: >
          Standard pricing variable largely synchronised with the cash
          rate. Discounting / cashback activity moves through cycles —
          intense 2022-2024, moderating 2025-2026. Front-book vs back-
          book pricing differential is the dominant driver of mortgage
          NIM evolution at each bank.

      - sub_dimension: Deposit pricing
        rating: moderate
        rationale: >
          Term-deposit specials and at-call rate moves are the
          competitive battleground. Major bank ATC (at-call) deposit
          rates moved differently in the 2022-2023 RBA hiking cycle —
          the asymmetry between hike pass-through on lending and
          deposits is itself a margin lever.

      - sub_dimension: Business and institutional pricing
        rating: moderate
        rationale: >
          Annual relationship reviews, multi-bank competition for
          quality corporates. Less volatile than retail mortgage
          pricing.

  disruption_vectors:
    - vector: non_bank_mortgage_share_gains
      nature: threat
      incumbency_position: defender
      time_horizon: "0-5 years"
      severity: moderate
      certainty: moderate
      description: >
        Non-bank lenders take 1-3pp of system mortgage flow share
        per credit-tightening cycle. Net structural drag on Big Four
        mortgage growth even in benign periods. Reverses partially
        when bank credit policies loosen.

    - vector: superannuation_funded_member_lending
      nature: threat
      incumbency_position: defender
      time_horizon: "5-10 years"
      severity: low
      certainty: low
      description: >
        Super funds entering member lending (mainly mortgages) directly
        — early-stage but a credible long-tail threat to bank ROE if
        super-funded lenders can match bank cost of capital. Regulatory
        framework still being negotiated.

    - vector: open_banking_and_data_portability
      nature: opportunity_or_threat
      incumbency_position: neutral
      time_horizon: "3-7 years"
      severity: moderate
      certainty: moderate
      description: >
        Consumer Data Right framework lowers retail switching frictions
        over time. Big Four with strong digital execution (CBA
        consistently leading) benefit on offence; weaker-digital banks
        exposed. Asymmetric outcome.

    - vector: climate_risk_weight_adjustment
      nature: threat
      incumbency_position: neutral
      time_horizon: "3-7 years"
      severity: low_to_moderate
      certainty: moderate
      description: >
        APRA progressively incorporating climate-related credit risk
        into IRB models. Higher risk weights on transition-vulnerable
        mortgage book (high-flood-zone, high-bushfire-zone properties)
        and on transition-vulnerable business book (mining, oil/gas).
        Compresses ROE in affected portfolios; capital reallocation
        toward lower-risk exposures.

    - vector: digital_native_business_banking
      nature: threat
      incumbency_position: defender
      time_horizon: "3-7 years"
      severity: low_to_moderate
      certainty: moderate
      description: >
        Judo Bank, Tyro, and SME-focused fintech lenders take share
        in specific SME segments. Big Four defensive position:
        scale, branch network, transaction-banking bundling. Judo
        IPO 2021 a credible counter-example to "fintech can't scale
        in business banking".

  regulatory_regime:
    primary_regulators:
      - "APRA (Australian Prudential Regulation Authority) — prudential capital, liquidity, governance"
      - "ASIC (Australian Securities and Investments Commission) — conduct, disclosure, financial advice"
      - "ACCC (Australian Competition and Consumer Commission) — competition, mergers"
      - "RBA (Reserve Bank of Australia) — monetary policy, payments oversight, financial stability"
      - "RBNZ (Reserve Bank of New Zealand) — NZ subsidiary supervision"
      - "AUSTRAC — anti-money-laundering / counter-terrorism financing"
    current_pressure: high
    known_step_changes:
      - "APRA capital framework reform implementation (in progress 2023-2026)"
      - "APRA D-SIB surcharge continues at +1.0% for Big Four"
      - "RBNZ capital requirements remain high (BS2A NZ subsidiary capital floor)"
      - "Climate-related risk weight integration progressing under APRA CPS 230 framework"
      - "AUSTRAC enforcement actions (Westpac 2020 AUD 1.3bn settlement; ongoing scrutiny)"

  cyclicality:
    cycle_length_years: 10
    current_cycle_phase: late_mid
    amplitude: high
    rationale: >
      Credit cycle dominates. Through-cycle credit losses 15-25bps of
      gross loans for Big Four; peak-cycle (GFC-equivalent) 60-100bps.
      Current position late-mid cycle: housing-market exuberance from
      2020-2022 has cooled, business-banking impairment cycle has
      normalised post-COVID, no clear single-driver crisis catalyst —
      but cycle-mature positioning means downside scenarios have less
      buffer than they would at trough.

  input_dependencies:
    critical_inputs:
      - "Retail deposit funding (households + SMEs)"
      - "Wholesale funding (covered bond, senior unsecured, securitisation)"
      - "Capital (CET1 retention from cash earnings; secondary equity raisings)"
      - "Regulatory licence (APRA ADI licence + RBNZ NZ licence)"
      - "Technology stack (core banking, digital channels, payments rails)"
    supply_risk: low_to_moderate
    rationale: >
      Funding mix risk is the dominant supply-side concern. The Big
      Four typical funding stack: 60-70% deposits, 20-25% wholesale
      debt, 5-10% capital. Stressed conditions (2008, 2020-COVID,
      2023 mini-banking-crisis episodes) widen wholesale spreads
      sharply and constrain primary issuance. Deposit-funding ratio
      is the key resilience metric.

  bank_archetype:
    # Bank-archetype-specific block per methodology §15.6 and §15.9.
    # Adds bank-relevant calibration anchors to the archetype layer.

    regulator: APRA
    secondary_regulators:
      - RBNZ
      - ASIC

    cet1_floor:
      # Corrected under D-59, 16 Sep 2026. Every component below is a CET1
      # measure sourced to APRA. What was here before mixed bases: the
      # regulatory minimum held 0.08, which is the TOTAL capital minimum
      # (Tier 1 plus Tier 2), in a field measured on CET1; and the conservation
      # buffer held the 0.025 standardised figure while the Big Four are all
      # IRB. The four then summed to 0.125 against a stated 0.115, and the
      # components_in_total declaration was used to carve the countercyclical
      # buffer out to make the arithmetic close. That carve-out was wrong about
      # APRA — APS 110 sets the CCyB by extending the range of the capital
      # conservation buffer, so it sits INSIDE the requirement — and it hid the
      # basis error underneath it. The 0.115 was an operating target, and is now
      # declared as one in cet1_operating_target below.
      regulatory_minimum: 0.045
      capital_conservation_buffer: 0.0375
      countercyclical_buffer: 0.01
      d_sib_surcharge: 0.01
      total_floor: 0.1025
      components_in_total:
        - regulatory_minimum
        - capital_conservation_buffer
        - countercyclical_buffer
        - d_sib_surcharge
      rationale: >
        APRA's "unquestionably strong" framework as it stands. CET1
        minimum (PCR) 4.5% per APS 110. Capital conservation buffer
        3.75% for ADIs on the IRB approach, against 2.5% standardised;
        all four majors are IRB. Big Four are designated D-SIB and carry
        the +1.0% surcharge on top. Countercyclical buffer at APRA's
        default 1.0% of RWA, effective 1 January 2023 (announced 21
        December 2022, previously zero since 2016), and inside the
        requirement rather than beside it. Total for a major therefore
        4.5 + 3.75 + 1.0 + 1.0 = 10.25%. The comparable figure for a
        standardised, non-D-SIB ADI is 4.5 + 2.5 + 1.0 = 8.0% — the
        10.5% previously recorded here for regionals was the same
        mixed-basis error. Sources: APS 110 Capital Adequacy (Jan 2023);
        APRA Explains "Capital buffers in banking"; APRA information
        paper "An Unquestionably Strong Framework for Bank Capital".

    cet1_operating_target:
      level: 0.115
      basis: >
        Top of the operating range the Big Four have typically run
        post-2023, management buffer already inside the level rather
        than added on top of it. Archetype-level anchor; a company
        overrides it with its own board-approved target where one is
        disclosed.
      rationale: >
        The level that governs distribution behaviour, which is not the
        regulatory floor: a bank cuts a dividend or stops a buyback to
        defend its operating target, long before the floor is in view.
        Implied management buffer over the corrected floor is 125bp,
        inside the 50-150bp band the majors have historically run and
        consistent with APRA's own expectation in the framework paper
        that majors would operate above 11% from 2023. NOTE for the
        §15.5 constraint work: Westpac's own disclosure has moved on
        from the range this archetype level sits at the top of — its
        board target is now a post-dividend CET1 above 11.25%, stated
        as replacing the former 11.00-11.50% range, following APRA's
        phase-out of AT1 from 1 January 2027. That is a company-level
        figure and belongs in wbc.yaml, not here; recorded as an open
        item rather than changed in passing.

    credit_cycle_anchor:
      through_cycle_loss_rate_bps: 20
      peak_cycle_loss_rate_bps: 80
      benign_cycle_loss_rate_bps: 5
      rationale: >
        Big Four through-cycle anchor 15-25bps of gross loans. Peak
        cycle (GFC, COVID stress) 60-100bps. Benign / current low
        (2025-2026 has been benign) 5-15bps. Stages 1+2 expected loss
        provision covers the through-cycle anchor; stage 3 emerges
        in scenario-stress periods.

    rwa_density_anchor:
      housing_mortgages: 0.30
      business_lending: 0.80
      institutional: 0.50
      sovereign_and_high_grade: 0.05
      rationale: >
        Indicative IRB risk-weighted asset density per AUD of credit
        exposure. Housing 25-35% (depends on LVR mix and IRB model);
        business lending 70-90%; institutional / sovereign / treasury
        much lower. Each bank's actual density varies by portfolio
        mix; specific values per bank in the company YAMLs.

    cost_of_equity_anchor:
      risk_free_rate: 0.0430
      equity_risk_premium: 0.0500
      beta_range_measured: [0.57, 0.88]
        # Measured β across the listed peer set (CBA, NAB, WBC, ANZ, MQG)
        # from EODHD 15 June 2026 feeds.
      beta_range_comparable_cluster: [0.72, 0.80]
        # Excluding ANZ (institutional/international outlier at 0.57) and
        # MQG (different archetype at 0.88). Comparable cluster is the
        # Big Four retail-and-business-bank franchises.
      beta_anchor_selected: 0.75
        # Peer cluster midpoint. Recommended starting point for selected β
        # under the §15.2(c) peer-triangulation discipline; subject company
        # is positioned within or near this anchor based on franchise mix.
      cost_of_equity_range_measured: [0.0715, 0.0870]
      cost_of_equity_range_comparable: [0.0790, 0.0830]
      cost_of_equity_anchor_selected: 0.0805
      peer_beta_dataset_2026_06_15:
        - bank: CBA
          beta_measured: 0.80
          inclusion: comparable_peer
          notes: "Franchise leader; deposit and digital scale; retail-mortgage-anchored."
        - bank: NAB
          beta_measured: 0.72
          inclusion: comparable_peer
          notes: "Business-banking leader; retail-and-business mix."
        - bank: WBC
          beta_measured: 0.73
          inclusion: comparable_peer
          notes: "Mortgage-book scale #2; business-banking rebuild."
        - bank: ANZ
          beta_measured: 0.57
          inclusion: excluded_outlier
          notes: "Institutional / international revenue dilution; Suncorp integration period disrupting price series. Use peer-implied value for ANZ's own valuation."
        - bank: MQG
          beta_measured: 0.88
          inclusion: informative_not_comparable
          notes: "Different archetype — markets / asset management / commodities trading dilutes banking comparability."
      rationale: |
        Cost-of-equity anchor for Big Four retail-and-business banks.
        Australian government bond yield (10y) and Damodaran-style
        matu