industry_archetype:
  id: specialty_pharmaceuticals
  name: Specialty Pharmaceuticals (Renal, Cardiology, Iron Deficiency, Rare Disease)
  version: 2026-Q2-v1

  # D-72 / D-37 (14 Oct 2026, Stephen's ruling): the segment's nominal growth
  # tracks nominal GDP plus a fixed gap calibrated to the steady-state rate CSL's
  # segment block types for each scenario. Stephen asked for US real GDP as the
  # base; only two of the six scenario files carry real_gdp_growth_us, so the base
  # is world real GDP + advanced CPI until scenario development adds the US series
  # to all six (then change `series` here and rerun -- nothing else). ONE
  # nominal series, deliberately: splitting it into volume (GDP + gap) and price
  # (CPI + healthcare spread) needs a healthcare-inflation view nobody has
  # written down yet, and typing a spread to make the split would invent a
  # number. The split is a follow-up for scenario development / Five Forces.
  # Written into data/scenarios/*.yaml by scripts/derive_macro_driver_paths.py.
  required_macro_drivers:
    - variable: specialty_pharma_nominal_growth
      derivation:
        method: spread
        series: [real_gdp_growth_us, cpi_inflation_advanced]
        anchor:
          company: csl
          path: normalised_baseline.segment_fcff.by_scenario.{scenario}.vifor_cagr
  archetype_class: biopharmaceutical_specialty
  # 15 Oct 2026 (item (c), step 1): price rate = advanced CPI (Stephen's ruling). Volume
  # is the nominal driver less this. A healthcare premium over CPI is a later decision.
  segment_price_series: cpi_inflation_advanced

  # D-78 / D-79 (14 Oct 2026): declared EMPTY, and that is the answer, not a gap.
  # A segment-valued company's growth chain has no scenario-invariant terms: the
  # segment grows at this archetype's declared series plus a company offset that
  # is the typed path less its own steady state, zero by construction at year 10
  # (translator.segment_growth_path_from_data). So nothing is current-cycle by
  # declaration; the offset expires inside the explicit period on its own.
  # Terminal growth is DERIVED (D-79): the revenue-weighted mean of the segment
  # series at year 10, capped at scenario nominal GDP
  # (translator.segment_terminal_growth_from_data). Ratified by Stephen 14 Oct 2026.
  growth_chain_terms: []

  geography: global

  submarkets:
    - region: United States
      weight: 0.45

    - region: Europe + UK
      weight: 0.30

    - region: Rest of world
      weight: 0.25

  five_forces:
    buyer_power:
      rating: moderate
      rationale: >
        Healthcare payer concentration drives material price-negotiation
        power. Many products have therapeutic alternatives, providing
        substitution leverage. US Medicare Part D pricing pressure
        relevant on selected products.

    supplier_power:
      rating: low
      rationale: >
        Active pharmaceutical ingredient (API) suppliers concentrated for
        some products but generally available. Commodity inputs for most.

    threat_of_new_entrants:
      rating: low_to_moderate
      rationale: >
        Patent protection limits entry during patent life. Post-patent
        exposure to generics / biosimilars depending on product type.
        Lifecycle management (LCM — new indications, formulations,
        delivery forms) extends product life.

    threat_of_substitutes:
      rating: low_to_moderate
      rationale: >
        Therapeutic class alternatives exist for most products. Substitution
        risk depends on clinical differentiation.

    rivalry:
      rating: moderate
      rationale: >
        Multiple players per therapeutic class. Pricing pressure varies
        by maturity of product class and number of competitors.

  cyclicality:
    cycle_length_years: 7
    current_cycle_phase: mid
    amplitude: low
    rationale: >
      Pharmaceutical demand relatively counter-cyclical. Patent cycle
      drives revenue stability within product life followed by post-
      expiry decline (mitigated by LCM).

  input_dependencies:
    critical_inputs:
      - "Active pharmaceutical ingredients (API)"
      - "Excipients and formulation ingredients"
      - "Specialised manufacturing equipment"
    supply_risk: low_to_moderate
