scenario:
  id: orderly_convergence
  name: Orderly Convergence
  version: 2026-Q2-v1
  published: 2026-05-16

  narrative:
    key_mechanism: >
      The set of conditions for benign resolution all come together. Inflation
      cools to target via supply-side normalisation and AI-enabled productivity
      gains absorbing wage growth. Real rates settle modestly positive but
      defensibly. Climate-policy reset restores coordinated transition. AI
      delivers economy-wide productivity surprise — adoption broadens, rents
      diffuse to users, productivity surprise supports lower inflation and
      higher real growth simultaneously. Geopolitical tensions resolve
      materially. US powerhouse propagates lift to Europe and EM. The world
      the IMF reference forecast and OECD baseline implicitly assume but
      almost no one privately bets on.
    distinguishing_features: >
      Unlike Muddle Through, inflation returns to target and real rates
      normalise. Unlike Stagflation Persists, inflation re-anchors rather than
      breaking higher. Unlike Fragmentation, geopolitical tensions resolve and
      trade barriers relax. Unlike Disorderly Climate Crystallisation, the
      climate path resolves orderly via political reset rather than crystallising
      via crisis. Unlike AI Productivity Lag, AI productivity transmission works.
      The single scenario where every dimension resolves favourably.
    leading_indicators: >
      Sustained advanced-economy inflation move toward target with credible
      central-bank communication; meaningful US-China stabilisation evidence
      (trade framework agreements, military de-escalation); Middle East
      de-escalation; bilateral trade-barrier reductions; political coalitions
      rebuilding around climate-policy commitments; enterprise-adoption surveys
      showing AI integration broadening beyond early-adopter cohort with
      productivity flow-through.
    disconfirming_evidence: >
      Continued sticky inflation despite supply normalisation (would shift
      toward Muddle Through). Inflation-expectations un-anchoring (would shift
      toward Stagflation Persists). Geopolitical escalation events (would shift
      toward Fragmentation). Major physical-loss event or carbon-policy crisis
      (would shift toward Disorderly Climate Crystallisation). Persistent
      enterprise-AI adoption lag despite continued investment (would shift
      toward AI Productivity Lag).

  time_profile:
    - phase: convergence
      year_start: 1
      year_end: 4
      characterisation: >
        Inflation cools to target; real rates normalise; AI adoption broadens;
        geopolitical resolution progressing. Phase-in over 3-4 years from
        current conditions to new steady state.
    - phase: steady_state
      year_start: 5
      year_end: null
      characterisation: >
        New equilibrium: target inflation, modestly positive real rates,
        broad-based productivity gains, orderly climate transition, normalised
        geopolitics. Conditions sustainable through the horizon though
        long-term demographic challenges remain.

  macro_variables:
    # BEGIN resource prices (gold_producers archetype; typed scenario series, not derived)
    # Real prices are in 2026 US dollars and are inflated by this scenario's
    # cpi_inflation_advanced inside the engine; aud_usd is nominal US dollars per A$1.
    - variable: gold_price_usd_real
      units: usd_per_oz_real_2026
      type: time_series
      # Scenario development, 20 Oct 2026 (EVN, the first resource archetype; D-99 proposed).
      # Year 0 reference: spot US$4,166/oz, 16 Oct 2026 (pricegold.net).
      # Basis: Geopolitical tension resolves and real rates settle positive, so the safe-haven and
      # reserve-diversification bid fades; the price reverts toward the pre-2024 real regime but
      # holds above it because official-sector holdings are sticky.
      time_series:
        - {year: 1, value: 3900}
        - {year: 3, value: 3400}
        - {year: 5, value: 3100}
        - {year: 7, value: 3000}
        - {year: 10, value: 3000}
    - variable: copper_price_usd_real
      units: usd_per_t_real_2026
      type: time_series
      # Scenario development, 20 Oct 2026 (EVN, the first resource archetype; D-99 proposed).
      # Year 0 reference: EVN September 2026 quarter achieved US$6.69/lb, about US$14,750/t.
      # Basis: Sustained transition demand with supply responding (scenario metals_regime): a firm
      # but not spiking copper price.
      time_series:
        - {year: 1, value: 14000}
        - {year: 3, value: 13500}
        - {year: 5, value: 13000}
        - {year: 7, value: 13000}
        - {year: 10, value: 13000}
    - variable: aud_usd
      units: usd_per_aud
      type: time_series
      # Scenario development, 20 Oct 2026 (EVN, the first resource archetype; D-99 proposed).
      # Year 0 reference: close 0.6968, 19 Oct 2026 (poundsterlinglive.com).
      # Basis: USD softens as the Fed eases and capital reglobalises (scenario fx_regime); a risk-on
      # commodity currency appreciates.
      time_series:
        - {year: 1, value: 0.71}
        - {year: 3, value: 0.73}
        - {year: 5, value: 0.74}
        - {year: 7, value: 0.74}
        - {year: 10, value: 0.74}
    # END resource prices
    # BEGIN derived paths (vaccines)
    # Written by scripts/derive_macro_driver_paths.py from the derivations declared in
    # data/industries/vaccines.yaml; asserted by tests/test_macro_driver_paths.py.
    # Not hand-typed: edit the declaration, the anchors or the base series, then rerun.
    - variable: seasonal_vaccines_nominal_growth
      units: percent_yoy
      type: time_series
      # real_gdp_growth_us + cpi_inflation_advanced plus a fixed gap of -2.28pp (spread, not multiple)
      time_series:
        - {year: 1, value: 3.02}
        - {year: 3, value: 2.62}
        - {year: 5, value: 2.52}
        - {year: 7, value: 2.32}
        - {year: 10, value: 2.02}
    # END derived paths
    # BEGIN derived paths (specialty_pharmaceuticals)
    # Written by scripts/derive_macro_driver_paths.py from the derivations declared in
    # data/industries/specialty_pharmaceuticals.yaml; asserted by tests/test_macro_driver_paths.py.
    # Not hand-typed: edit the declaration, the anchors or the base series, then rerun.
    - variable: specialty_pharma_nominal_growth
      units: percent_yoy
      type: time_series
      # real_gdp_growth_us + cpi_inflation_advanced plus a fixed gap of +3.72pp (spread, not multiple)
      time_series:
        - {year: 1, value: 9.02}
        - {year: 3, value: 8.62}
        - {year: 5, value: 8.52}
        - {year: 7, value: 8.32}
        - {year: 10, value: 8.02}
    # END derived paths
    # BEGIN derived paths (plasma_derived_therapies)
    # Written by scripts/derive_macro_driver_paths.py from the derivations declared in
    # data/industries/plasma_derived_therapies.yaml; asserted by tests/test_macro_driver_paths.py.
    # Not hand-typed: edit the declaration, the anchors or the base series, then rerun.
    - variable: plasma_therapies_nominal_growth
      units: percent_yoy
      type: time_series
      # real_gdp_growth_us + cpi_inflation_advanced plus a fixed gap of +1.72pp (spread, not multiple)
      time_series:
        - {year: 1, value: 7.02}
        - {year: 3, value: 6.62}
        - {year: 5, value: 6.52}
        - {year: 7, value: 6.32}
        - {year: 10, value: 6.02}
    # END derived paths
    # BEGIN derived paths (industrial_explosives)
    # Written by scripts/derive_macro_driver_paths.py from the derivations declared in
    # data/industries/industrial_explosives.yaml; asserted by tests/test_macro_driver_paths.py.
    # Not hand-typed: edit the declaration, the anchors or the base series, then rerun.
    - variable: global_mining_real_growth
      units: percent_yoy
      type: time_series
      # real_gdp_growth_world plus a fixed gap of +0.96pp (spread, not multiple)
      time_series:
        - {year: 1, value: 3.76}
        - {year: 3, value: 4.06}
        - {year: 5, value: 4.16}
        - {year: 7, value: 4.08}
        - {year: 10, value: 3.96}
    - variable: gas_price_growth
      units: percent_yoy
      type: time_series
      # the scenario's anchor until its equilibrium year (5), then muddle_through's
      time_series:
        - {year: 1, value: 1.5}
        - {year: 3, value: 1.5}
        - {year: 5, value: 2.0}
        - {year: 7, value: 2.0}
        - {year: 10, value: 2.0}
    # END derived paths
    # BEGIN derived paths (australian_major_banks)
    # Written by scripts/derive_macro_driver_paths.py from the derivations declared in
    # data/industries/australian_major_banks.yaml; asserted by tests/test_macro_driver_paths.py.
    # Not hand-typed: edit the declaration, the anchors or the base series, then rerun.
    - variable: bank_system_aiea_growth
      units: percent_yoy
      type: time_series
      # real_gdp_growth_world + cpi_inflation_advanced plus a fixed gap of +1.12pp (spread, not multiple)
      time_series:
        - {year: 1, value: 6.72}
        - {year: 3, value: 6.62}
        - {year: 5, value: 6.62}
        - {year: 7, value: 6.42}
        - {year: 10, value: 6.12}
    # END derived paths
    - variable: real_gdp_growth_world
      units: percent_yoy
      type: time_series
      time_series:
        - {year: 1, value: 2.8, confidence_low: 2.3, confidence_high: 3.2}
        - {year: 3, value: 3.1, confidence_low: 2.6, confidence_high: 3.5}
        - {year: 5, value: 3.2, confidence_low: 2.7, confidence_high: 3.6}
        - {year: 10, value: 3.0, confidence_low: 2.5, confidence_high: 3.5}

    - variable: real_gdp_growth_us
      units: percent_yoy
      type: time_series
      time_series:
        - {year: 1, value: 2.5, confidence_low: 2.0, confidence_high: 3.0}
        - {year: 5, value: 2.5, confidence_low: 2.0, confidence_high: 3.0}
        - {year: 10, value: 2.3, confidence_low: 1.8, confidence_high: 2.8}

    - variable: cpi_inflation_advanced
      units: percent_yoy
      type: time_series
      time_series:
        - {year: 1, value: 2.8, confidence_low: 2.5, confidence_high: 3.1}
        - {year: 3, value: 2.4, confidence_low: 2.0, confidence_high: 2.7}
        - {year: 5, value: 2.3, confidence_low: 2.0, confidence_high: 2.5}
        - {year: 10, value: 2.0, confidence_low: 1.7, confidence_high: 2.3}

    - variable: policy_rate_real_advanced
      units: percent
      type: time_series
      time_series:
        - {year: 1, value: 1.5, confidence_low: 1.0, confidence_high: 2.0}
        - {year: 3, value: 1.0, confidence_low: 0.5, confidence_high: 1.5}
        - {year: 5, value: 0.8, confidence_low: 0.3, confidence_high: 1.2}
        - {year: 10, value: 0.8, confidence_low: 0.3, confidence_high: 1.2}

    - variable: inflation_regime
      units: regime
      type: regime
      regime:
        label: anchored_at_target
        description: >
          Central banks succeed in re-anchoring inflation expectations near
          target; structural overshoot resolves rather than being accepted.

  geopolitical:
    bloc_dynamics: >
      Meaningful US-China stabilisation: trade frameworks negotiated, military
      tensions managed, technology export controls relaxed selectively.
      Middle East de-escalation with security architecture refresh.
      Russia-NATO standoff de-escalates over the medium term.
    trade_policy: >
      Bilateral barrier reductions; tariffs partly rolled back; export-control
      regimes simplified to focus on genuinely dual-use technology rather than
      broad-strategic-classification. Supply chain regionalisation slows;
      partial reglobalisation in lower-sensitivity categories.
    resource_nationalism: >
      Eases as bloc stabilisation reduces incentives. Critical-mineral
      cooperation frameworks emerge between aligned economies; export
      restrictions selectively relaxed.

  technology:
    productivity_regime: >
      Aggregate TFP grows 1.5–2.0% — the bull-case productivity surprise
      materialises. Enterprise AI adoption broadens beyond early-adopter
      cohort; rents diffuse from platform owners to broader user base over
      the medium term. Compounding gains.
    disruption_vectors:
      - AI economy-wide — productivity transmission works
      - Electrification accelerating with grid investment catching up
      - Biotech — orderly pipeline progression with platform-stage breakthroughs

  regulatory:
    climate_policy: >
      Political reset restores coordinated transition. Carbon-pricing
      trajectories reaffirmed and extended; renewables / EV / transition-
      minerals subsidies stabilised on long-term frameworks; cross-border-
      adjustment mechanisms harmonised across major economies. Aggregate
      emissions trajectory bends downward toward IEA STEPS or modestly better.
    financial_regulation: >
      Stable. Basel finalisation completed without disruption; post-SVB
      framework integrated; non-bank oversight evolving without acute
      tightening.
    healthcare_regulation: >
      Stable drug-pricing frameworks; coordinated international approach to
      pharmaceutical innovation incentives; biosimilar competition continues
      orderly substitution.

  commodity_and_energy:
    oil_regime: >
      Brent in USD 60–80 range. Geopolitical-risk premium compresses;
      transition demand modestly damping but offset by EM growth.
    gas_regime: >
      Stable post-Russia-EU rewiring; ample LNG capacity; orderly transition
      to lower share of energy mix.
    metals_regime: >
      Transition-mineral demand sustained; copper, lithium, nickel in
      structural up-cycle but supply responding; price spikes moderated.
    ag_regime: >
      Well-supplied; transition to lower-carbon agricultural practices
      proceeding without disruption.

  demand_profile:
    consumer: >
      Real-spending growth recovers to pre-pandemic trend; saving rates
      normalise; durable-goods cycle resets.
    industrial: >
      Manufacturing PMI in expansion territory; capex broadens beyond AI /
      transition into general business investment as policy uncertainty fades.
    infrastructure: >
      Spending continues on transition infrastructure; private capital
      participation expands.
    healthcare: >
      Robust demand on demographic drivers; pricing frameworks stable
      supporting innovation economics.

  financial_conditions:
    policy_rates: >
      Nominal cash rates settle 3.0–3.5% in advanced economies; central banks
      ease modestly into the convergence as inflation cooperates. Real rates
      0.8%.
    credit_spreads: >
      Tight across investment-grade and high-yield as risk appetite recovers;
      sovereign spreads compress.
    fx_regime: >
      USD softens modestly as Fed eases; EM currencies recover; capital flows
      reglobalise.
    equity_risk_premium: >
      Compresses below long-term average as risk appetite recovers and growth
      visibility improves. Growth-stock premium re-expands.

  probability: null
