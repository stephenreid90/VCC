terminal_return_sets:
  current:
    name: current
    basis: 'Two readings, struck on production engine output. Return on NEW capital
      comes from the growth identity g = return x reinvestment_rate. Return on the
      WHOLE capital base is terminal earnings over invested capital as D-49''s roll-forward
      leaves it, and is reported wherever a company declares capex_rule grows_capital_base_at_g
      -- DNL today. The GOVERNING reading, which D-42''s obligation is judged on,
      is whole-capital where it exists and new-capital otherwise: D-45''s ROIC is
      a return on capital, not on new capital. The distinction is not cosmetic --
      DNL Fragmentation sits below its WACC on one reading and above it on the other.
      For the bank fork the return is declared (terminal_roe) and the identity derives
      the retention rate instead, so the declared rate is reported.'
