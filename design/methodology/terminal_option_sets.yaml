terminal_option_sets:
  current:
    name: current
    basis: Every terminal basis on offer, struck on production engine year-T output
      and translated to value per share with the engine's own terminal discount factor.
      Capital is invested capital at T (D-44/D-49) for FCFF and closing book equity
      for the bank; CSL has none until its capital base is built. The earned return
      is next-year earnings over capital at T. The two-stage form holds capital and
      runs the earned return N years beyond the forecast, then converges. Implied
      moat inverts that form. Forward multiples are on year T+1 earnings. Implied
      return on new capital applies the growth identity to the cash flow each TV capitalises.
    regenerated_by: scripts/size_terminal_options.py
    asserted_by: tests/dcf/test_terminal_option_sets.py
    decisions:
    - D-62 to D-66 (PROPOSED)
    - D-44
    - D-49
    - M14
    extension_grid_years:
